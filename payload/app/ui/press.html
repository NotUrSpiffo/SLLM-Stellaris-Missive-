<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>언론사 인터뷰</title>
<style>
 :root{--bg:#06141b;--panel:#0b2230;--text:#dcecf0;--dim:#7fa3ad;--hi:#5fd4e4;--hi-text:#04161d;--gold:#e8c872;--linec:#5fd4e4;--good:#7bd88f;--bad:#e88;
  --line:color-mix(in srgb,var(--linec) 34%,transparent);--line2:color-mix(in srgb,var(--linec) 15%,transparent);--glow:95,212,228}
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.6 "Malgun Gothic",sans-serif;overflow:hidden}
 body{display:flex;flex-direction:column;border:1px solid var(--line)}
 button,textarea{font:inherit;color:inherit}
 [hidden]{display:none!important}
 #head{-webkit-app-region:drag;display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
 #emb{width:30px;height:30px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:15px;margin:0 6px;border-radius:50%}
 #head b{color:var(--hi);letter-spacing:.14em} #head .t{display:flex;flex-direction:column;line-height:1.25} #head small{color:var(--dim)} #head .sp{flex:1}
 #tally{-webkit-app-region:no-drag;border:1px solid var(--line);padding:4px 12px;border-radius:4px;color:var(--gold);font-size:12px;letter-spacing:.04em}
 #x{-webkit-app-region:no-drag;background:none;border:1px solid transparent;color:var(--dim);width:26px;height:22px;cursor:pointer;padding:0} #x:hover{border-color:var(--line);color:var(--text)}
 #main{flex:1;min-height:0;display:flex;flex-direction:column}
 .pad{padding:24px 28px;overflow-y:auto;flex:1}
 h2{margin:0 0 6px;font-size:15px;color:var(--gold);letter-spacing:.08em;font-weight:600}
 .hint{color:var(--dim);font-size:12px;margin:0 0 10px}
 .btn{padding:8px 20px;border:1px solid var(--hi);background:color-mix(in srgb,var(--hi) 16%,transparent);color:var(--hi);cursor:pointer;letter-spacing:.06em;border-radius:3px}
 .btn:hover:not(:disabled){background:color-mix(in srgb,var(--hi) 28%,transparent)} .btn:disabled{opacity:.45;cursor:default}
 .btn.sub{border-color:var(--line);color:var(--dim);background:none} .btn.sub:hover:not(:disabled){color:var(--text);border-color:var(--hi);background:none}
 .btn:focus-visible,.topic:focus-visible,#txt:focus-visible{outline:2px solid var(--hi)}
 .box{max-width:720px;margin:40px auto;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 70%,transparent);border-radius:8px;padding:26px 30px}
 .box p{margin:6px 0 14px;color:var(--dim)} .box ul{margin:0 0 16px;padding-left:18px;color:var(--dim)}
 /* 기자회견장 */
 #room{flex:1;min-height:0;display:grid;grid-template-columns:clamp(230px,24vw,300px) minmax(0,1fr);gap:12px;padding:14px 16px 0}
 #side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow-y:auto}
 .sec{font-size:11px;color:var(--dim);letter-spacing:.14em;margin:0}
 .topic{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:12px 14px;cursor:pointer;display:block;width:100%}
 .topic:hover:not(:disabled){border-color:var(--hi);box-shadow:0 0 14px rgba(var(--glow),.2)} .topic:disabled{cursor:default}
 .topic b{display:block;font-size:14px;margin-bottom:4px;color:var(--text)} .topic span{display:block;font-size:11.5px;color:var(--dim);line-height:1.45}
 .topic em{display:inline-block;margin-top:8px;font-style:normal;font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--dim)}
 .topic.active{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)} .topic.active em{color:var(--gold);border-color:var(--gold)}
 .topic.good em{color:var(--good);border-color:var(--good)} .topic.bad em,.topic.skipped em{color:var(--dim)}
 .topic.good,.topic.bad,.topic.skipped{opacity:.82}
 #rules{border:1px solid var(--line2);border-radius:6px;padding:10px 12px;font-size:11.5px;color:var(--dim);background:color-mix(in srgb,var(--bg) 70%,transparent)}
 #center{display:flex;flex-direction:column;min-height:0}
 #stage{position:relative;height:150px;flex:none;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:radial-gradient(ellipse at 50% 0%,rgba(var(--glow),.18),transparent 60%),linear-gradient(#0a2230,#04101a)}
 #stage::before{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:repeating-linear-gradient(90deg,transparent 0,transparent 38px,color-mix(in srgb,var(--linec) 10%,transparent) 39px,transparent 40px),linear-gradient(transparent,color-mix(in srgb,var(--panel) 80%,transparent))}
 #stage .lbl{position:absolute;top:10px;left:16px;font-size:10px;letter-spacing:.25em;color:var(--gold)}
 #stage .dt{position:absolute;top:10px;right:16px;font-size:10px;color:var(--dim)}
 .seat{position:absolute;bottom:10px;display:flex;align-items:flex-end;gap:10px}
 .seat.rep{left:22px} .seat.lead{right:22px;flex-direction:row-reverse;text-align:right}
 .seat img{height:110px;width:auto;max-width:120px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(var(--glow),.25))}
 .seat .ph{width:84px;height:104px;border:1px solid var(--line);border-radius:44px 44px 6px 6px;display:grid;place-items:center;color:var(--dim);font-size:26px;background:color-mix(in srgb,var(--panel) 70%,transparent)}
 .seat .nm b{display:block;color:var(--text);font-size:13px} .seat .nm small{color:var(--dim);font-size:11px}
 .flash{position:absolute;top:30px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 18px 8px #fff8}
 #stage.busy .flash{animation:fl 1.6s infinite} .flash.f1{left:34%} .flash.f2{left:48%;animation-delay:.5s!important} .flash.f3{left:61%;animation-delay:1.1s!important}
 @keyframes fl{0%,100%{opacity:0}8%{opacity:.9}18%{opacity:0}}
 #log{flex:1;min-height:0;overflow-y:auto;margin-top:10px;border:1px solid var(--line2);border-radius:6px;padding:12px 14px;background:color-mix(in srgb,var(--bg) 80%,transparent)}
 .msg{margin:0 0 12px;max-width:88%} .msg b{display:block;font-size:11px;letter-spacing:.06em;margin-bottom:2px} .msg div{white-space:pre-wrap}
 .msg.reporter b{color:var(--hi)} .msg.player{margin-left:auto;text-align:right} .msg.player b{color:var(--gold)}
 .msg.player div{background:color-mix(in srgb,var(--gold) 10%,transparent);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);border-radius:6px;padding:6px 10px;display:inline-block;text-align:left}
 .msg.desk{max-width:100%;border-top:1px dashed var(--line);padding-top:8px;color:var(--dim);font-size:12px} .msg.desk.good{color:var(--good)}
 .topichead{font-size:11px;color:var(--gold);letter-spacing:.12em;margin:14px 0 8px;border-bottom:1px solid var(--line2);padding-bottom:3px}
 #in{flex:none;margin:12px 16px 14px;border:1px solid var(--line);border-radius:6px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
 #txt{width:100%;height:70px;resize:none;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;color:var(--text)}
 #row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} #row .sp{flex:1} #cnt{color:var(--dim);font-size:11.5px}
 #err{color:var(--bad);font-size:12px;min-height:1em}
 #res .topic{cursor:default;margin-bottom:8px}
 .big{font-size:28px;color:var(--gold);margin:4px 0 8px;letter-spacing:.06em}
 /* 정부 발표 칸·칙령 확인 카드(2026-10-18) */
 .topic.gov{border-color:color-mix(in srgb,var(--gold) 55%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 12%,var(--panel)),var(--panel))}
 .topic.gov b{color:var(--gold)} .topic.gov b::before{content:"✦ "}
 .bribe{display:flex;flex-direction:column;gap:4px;margin:10px 0;padding:8px 10px;border:1px dashed color-mix(in srgb,var(--gold) 50%,transparent);border-radius:6px} .bribe small{color:var(--dim);font-size:11.5px} .bribe b{color:var(--gold)}
 .govnote{border:1px dashed color-mix(in srgb,var(--gold) 50%,transparent);border-radius:6px;padding:8px 10px;font-size:11.5px;color:var(--gold);line-height:1.5}
 #cardbg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20}
 #card{width:min(560px,92vw);max-height:88vh;overflow-y:auto;background:#efe6d2;color:#2b241a;border-radius:4px;padding:26px 30px 22px;box-shadow:0 10px 40px rgba(0,0,0,.6);font-family:"Noto Serif KR","Batang",Georgia,serif;position:relative}
 #card .k{letter-spacing:.2em;font-size:11px;opacity:.7} #card h3{margin:6px 0 4px;font-size:21px;line-height:1.3} #card .sub{font-size:13px;margin-bottom:12px}
 #card ul{list-style:none;padding:0;margin:0 0 12px;border-top:1px solid rgba(0,0,0,.2)} #card li{padding:6px 2px;border-bottom:1px solid rgba(0,0,0,.1);font-size:13.5px}
 #card li.pro::before{content:"▲ ";color:#2f7d3e} #card li.con::before{content:"▼ ";color:#9b2b20} #card li.foe::before{content:"✉ ";color:#9b2b20} #card li.drop{opacity:.55;text-decoration:line-through}
 #card .warn{font-size:12px;color:#9b2b20;margin:0 0 10px} #card .yrs{display:flex;gap:8px;align-items:center;margin:0 0 14px;font-size:13px} #card .yrs label{border:1px solid rgba(0,0,0,.3);border-radius:4px;padding:3px 10px;cursor:pointer} #card .yrs label.on{border-color:#2b241a;background:rgba(0,0,0,.08)}
 #card .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap} #card button{font:13px "Malgun Gothic",sans-serif;padding:7px 14px;border-radius:3px;cursor:pointer;border:1px solid #2b241a;background:none;color:#2b241a} #card button.ok{background:#2b241a;color:#efe6d2} #card button:disabled{opacity:.5}
 #card .seal{position:absolute;right:22px;top:18px;width:44px;height:44px;border-radius:50%;border:2px solid #9b2b20;color:#9b2b20;display:grid;place-items:center;font-size:20px;transform:rotate(-12deg)}
 #card .err{color:#9b2b20;font-size:12px;min-height:1em;margin-top:8px}
 @media(max-width:900px){#room{grid-template-columns:210px minmax(0,1fr);gap:8px;padding:8px}#in{margin:8px}.seat img{height:90px}}
</style><script src="theme.js"></script><script src="i18n-catalog.js"></script><script src="i18n-ui.js"></script><link rel="stylesheet" href="window-chrome.css"><link rel="stylesheet" href="press-room-art.css"></head><body data-room="press">
<div id="head"><div id="emb">✎</div><div class="t"><b id="ttl" data-i18n-skip></b><small id="sub"></small></div><div class="sp"></div><span id="tally" data-i18n-skip hidden></span><button id="x" aria-label="닫기">✕</button></div>
<div id="main" data-i18n-skip></div>
<script>
 const $ = (id) => document.getElementById(id);
 const L = (ko, en) => (window.SLLMI18n && window.SLLMI18n.pick ? window.SLLMI18n.pick(ko, en) : ko);
 const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
 let S = null, busy = false, lastErr = '', draft = '', mode = '';
 const statusLabel = (t, step) => S && ((S.sess && S.sess.scandal) || (S.last && S.last.scandal && !S.sess)) && !t.gov ? (t.status === 'good' ? L('해명 설득력 있음', 'Convincing') : t.status === 'bad' ? L('해명 실패', 'Unconvincing') : t.status === 'active' ? L('해명 중', 'Explaining') : L('해명 대기', 'Awaiting explanation')) : t.gov ? (t.status === 'good' ? L('발표 호평', 'Announcement well received') : t.status === 'bad' ? L('반응 냉담', 'Cold reception') : t.status === 'skipped' ? L('발표 안 함', 'No announcement') : t.status === 'active' ? L('발표 중', 'Announcing') : L('발표 대기', 'Ready to announce')) : t.status === 'good' ? L(`호평 +${step}%`, `Well received +${step}%`) : t.status === 'bad' ? L('반응 미지근 +0%', 'Lukewarm +0%') : t.status === 'skipped' ? L('다루지 않음', 'Not covered') : t.status === 'active' ? L('진행 중', 'In progress') : L('질문 대기', 'Waiting');
 function head() {
  const SC = S && ((S.sess && S.sess.scandal) || (!S.sess && S.scandal)); // 추문 긴급 기자회견(2026-10-20)
  const HK = (S && S.sess && S.sess.scandal) || (S && S.scandal && S.scandal.kind) || ''; // hearing = 첩보 의혹 청문회의 국내 기자회견
  $('ttl').textContent = SC ? (HK === 'hearing' ? L('긴급 기자회견 · 첩보 의혹 해명', 'EMERGENCY PRESS CONFERENCE · ESPIONAGE') : L('긴급 기자회견 · 추문 해명', 'EMERGENCY PRESS CONFERENCE · SCANDAL')) : L('언론사 인터뷰', 'PRESS INTERVIEW');
  const s = S && S.sess;
  $('sub').textContent = s ? `${s.outlet} · ${L('기자', 'Reporter')} ${s.reporter}` : (S && S.empire ? S.empire : L('플레이어 제국', 'Player empire'));
  const t = $('tally'); if (s && s.scandal) { t.hidden = false; t.textContent = s.scandal === 'hearing' ? L('설득력 있으면 국내 불이익 없음 · 아니면 생산 −9%(2년)·민심 −4', 'Convincing: no domestic penalty · otherwise output −9% (2 yr), mood −4') : L('해명이 설득력 있으면 민심 +6, 아니면 −4', 'Mood +6 if convincing, −4 if not'); } else if (s) { t.hidden = false; t.textContent = L(`호평 ${s.good}/${S.maxTopics} · 행복도 +${s.percent}% (1년)`, `Well received ${s.good}/${S.maxTopics} · Happiness +${s.percent}% (1 yr)`); } else t.hidden = true;
 }
 function err(m) { lastErr = m || ''; const e = $('err'); if (e) e.textContent = lastErr; }
 function seat(cls, img, name, role) { return `<div class="seat ${cls}">${img ? `<img src="${esc(img)}" alt="">` : `<div class="ph">${cls === 'rep' ? '✎' : '✦'}</div>`}<div class="nm"><b>${esc(name)}</b><small>${esc(role)}</small></div></div>`; }
 function drawIdle() {
  mode = 'idle'; const m = $('main'); const ready = S.phase === 'ready', last = S.last;
  let body = '';
  if (S.scandal && !last && S.scandal.kind === 'hearing') {
   body = `<div class="box"><h2>${L('긴급 기자회견 — 첩보 의혹 해명', 'Emergency press conference — the espionage affair')}</h2><p>${esc(L(`${S.scandal.suspect}이(가) 우리 첩보 공작을 문제 삼고 있습니다. 은하재판소 대신 국민 앞에서 해명합니다. 상대 관계 하락(−100, 약 2년)은 받아들이며, 해명이 설득력 없으면 국내 불이익(생산 −9%, 2년·민심 −4)도 받습니다.`, `${S.scandal.suspect} accuses us of espionage. Instead of the Galactic Tribunal you answer to the public. You accept the drop in relations (−100, about 2 years); if your explanation is unconvincing you also take the domestic penalty (output −9% for 2 years, mood −4).`))}</p><div class="bribe">${S.scandal.bribed ? `<b>${L('기자를 매수했습니다', 'The press has been paid off')}</b><small>${L('질문이 부드러워지고 편집국 평가가 아주 너그러워집니다.', 'Questions will be soft and the editorial verdict very lenient.')}</small>` : `<button class="btn sub" id="bribe"${busy ? ' disabled' : ''}>${L(`기자 매수 · 에너지 크레딧 ${S.scandal.bribeCost}`, `Bribe the press · ${S.scandal.bribeCost} energy credits`)}</button><small>${L('시작 전에만 할 수 있습니다. 매수하면 해명 난이도가 크게 낮아집니다.', 'Only before you begin. A bribe makes the explanation far easier.')}</small>`}</div><button class="btn" id="go"${busy ? ' disabled' : ''}>${L('기자회견 시작', 'Begin the press conference')}</button><p id="err">${esc(lastErr)}</p></div>`;
  } else if (S.scandal && !last) {
   body = `<div class="box"><h2>${L('긴급 기자회견 — 추문 해명', 'Emergency press conference — the scandal')}</h2><p>${esc(L(`기자들이 정부 추문에 대한 해명을 기다리고 있습니다. 정보기관은 ${S.scandal.suspect}의 첩보망을 의심합니다. 질문에 직접 답하세요. 해명이 설득력 있으면 민심이 오르고, 아니면 떨어집니다.`, `The press is waiting for an explanation of the government scandal. Intelligence suspects the spy network of ${S.scandal.suspect}. Answer the questions yourself: a convincing explanation lifts public mood, a weak one lowers it.`))}</p><div class="bribe">${S.scandal.bribed ? `<b>${L('기자를 매수했습니다', 'The press has been paid off')}</b><small>${L('질문이 부드러워지고 편집국 평가가 아주 너그러워집니다.', 'Questions will be soft and the editorial verdict very lenient.')}</small>` : `<button class="btn sub" id="bribe"${busy ? ' disabled' : ''}>${L(`기자 매수 · 에너지 크레딧 ${S.scandal.bribeCost}`, `Bribe the press · ${S.scandal.bribeCost} energy credits`)}</button><small>${L('시작 전에만 할 수 있습니다. 매수하면 해명 난이도가 크게 낮아집니다.', 'Only before you begin. A bribe makes the explanation far easier.')}</small>`}</div><button class="btn" id="go"${busy ? ' disabled' : ''}>${L('기자회견 시작', 'Begin the press conference')}</button><p id="err">${esc(lastErr)}</p></div>`;
  } else if (last && last.scandal) {
   body = `<div class="box" id="res"><h2>${L('기자회견 결과', 'Press conference result')}</h2><p>${esc(last.outlet)} · ${esc(last.date)}</p><div class="big">${last.scandal === 'hearing' ? (last.good ? L('해명 설득력 있음 · 국내 불이익 없음', 'Convincing · No domestic penalty') : L('해명 실패 · 생산 −9%(2년)·민심 −4', 'Unconvincing · Output −9% (2 yr), mood −4')) : last.good ? L('해명 설득력 있음 · 민심 +6', 'Convincing · Mood +6') : L('해명 실패 · 민심 −4', 'Unconvincing · Mood −4')}</div><p>${L('신문과 라디오가 결과를 다루고, 라디오 찬반 논평 알림이 이어집니다.', 'Newspapers and radio will cover it, and a radio debate alert follows.')}</p><button class="btn sub" id="ok">${L('닫기', 'Close')}</button></div>`;
  } else if (last) {
   body = `<div class="box" id="res"><h2>${L('인터뷰 결과', 'Interview result')}</h2><p>${esc(last.outlet)} · ${esc(last.date)}</p><div class="big">${L(`국민 행복도 +${last.percent}%`, `Pop Happiness +${last.percent}%`)}</div>${last.edict ? `<p class="govnote">${esc(L(`칙령 「${last.edict}」 발표 — 게임에 적용되었습니다. 신문·라디오가 다음 달 소식으로 다룹니다.`, `Edict "${last.edict}" proclaimed and applied in game. Newspapers and radio will cover it next month.`))}</p>` : ''}<p>${last.percent > 0 ? L(`호평 ${last.good}건 · 1년 동안 적용됩니다.`, `${last.good} topics well received · lasts 1 year.`) : L('좋은 평가를 받은 주제가 없어 효과는 없습니다. 벌점도 없습니다.', 'No topic was received well, so there is no effect. There is no penalty either.')}</p>${last.topics.map((t) => `<div class="topic ${t.status}"><b>${esc(t.title)}</b><span>${esc(t.verdict || '')}</span><em>${statusLabel(t, S.step)}</em></div>`).join('')}<p></p><button class="btn" id="ok">${L('닫기', 'Close')}</button></div>`;
  } else if (ready) {
   body = `<div class="box"><h2>${L('기자들이 기다리고 있습니다', 'The press is waiting')}</h2><p>${L('기자가 제국 연대기에서 국민이 궁금해할 주제 세 가지를 골라 옵니다. 주제는 원하는 순서로 직접 고를 수 있고, 한 주제 안에서는 몇 번이든 답할 수 있습니다.', 'The reporter picks three topics from the imperial chronicle that the public wants to hear about. You choose the order yourself and may answer as many times as you like within a topic.')}</p><ul><li>${L(`[다음 주제로]를 누르면 편집국이 그 주제를 평가합니다. 호평이면 국민 행복도 +${S.step}%.`, `Press [Next topic] and the editorial desk rates that topic. Well received = Pop Happiness +${S.step}%.`)}</li><li>${L(`[인터뷰 종료]를 누르면 합산한 효과가 게임에 1년 동안 적용됩니다(최대 +${S.step * S.maxTopics}%).`, `Press [End interview] to apply the total for 1 year (up to +${S.step * S.maxTopics}%).`)}</li><li>${L('나쁜 평가를 받아도 벌점은 없습니다. 새 인터뷰 효과는 이전 효과를 대신합니다.', 'A poor answer has no penalty. A new interview replaces the previous effect.')}</li><li>${L('「정부 발표」 칸(인터뷰마다 한 번): 직접 정책을 발표하면 기자들이 따져 묻고, 편집국이 평가와 함께 칙령으로 분류합니다. 인터뷰를 끝낼 때 확인 카드에서 확정해야 게임에 들어갑니다.', 'The "Government announcement" slot (once per interview): announce a policy yourself, reporters press you on it, and the desk rates it and classifies it as an edict. It only enters the game when you confirm the card at the end.')}</li></ul>${S.edictNow ? `<p class="govnote">${esc(L(`시행 중인 칙령: 「${S.edictNow.title}」 (${S.edictNow.end}까지) — 새 칙령을 확정하면 대신합니다.`, `Edict in force: "${S.edictNow.title}" (until ${S.edictNow.end}) — a new edict replaces it.`))}</p>` : ''}<button class="btn" id="go" ${busy ? 'disabled' : ''}>${busy ? L('기자가 질문을 준비하는 중…', 'The reporter is preparing questions…') : L('인터뷰 시작', 'Start interview')}</button><p id="err">${esc(lastErr)}</p></div>`;
  } else if (S.phase === 'prep') {
   body = `<div class="box"><h2>${L('인터뷰 준비 중', 'Preparing the interview')}</h2><p>${L(`게임 날짜 ${S.due}에 준비가 끝납니다. 준비가 끝나면 알림이 옵니다.`, `Preparation ends on game date ${S.due}. You will be notified.`)}</p><button class="btn sub" id="ok">${L('닫기', 'Close')}</button></div>`;
  } else {
   body = `<div class="box"><h2>${L('준비된 인터뷰가 없습니다', 'No interview is ready')}</h2><p>${L('게임의 시행령에서 "언론사 인터뷰"를 켜면 3개월 뒤에 인터뷰할 수 있습니다.', 'Enable the "Press Interview" edict in game; the interview becomes available 3 months later.')}</p><button class="btn sub" id="ok">${L('닫기', 'Close')}</button></div>`;
  }
  m.innerHTML = `<div class="pad">${body}</div>`;
  if ($('go')) $('go').onclick = async () => { err(''); busy = true; drawIdle(); try { const r = await window.sllm.pressBegin(); if (!r.ok) err(r.error); } finally { busy = false; draw(); } };
  if ($('ok')) $('ok').onclick = () => window.sllm.pressClose();
  if ($('bribe')) $('bribe').onclick = async () => { err(''); busy = true; drawIdle(); try { const r = await window.sllm.pressBribe(); if (!r.ok) err(r.error); } finally { busy = false; draw(); } }; // 기자 매수(2026-10-20)
 }
 function drawRoom() {
  const s = S.sess;
  if (mode !== 'room') {
   mode = 'room';
   $('main').innerHTML = `<div id="room"><div id="side"><p class="sec">${L('인터뷰 주제 · 직접 고르기', 'TOPICS · YOUR CHOICE')}</p><div id="topics"></div><div id="rules"></div></div><div id="center"><div id="stage"><span class="lbl">PRESS ROOM</span><span class="dt" id="dt"></span><i class="flash f1"></i><i class="flash f2"></i><i class="flash f3"></i><div id="seats"></div></div><div id="log"></div></div></div>
   <div id="in"><textarea id="txt" maxlength="1200"></textarea><div id="row"><span id="cnt"></span><div class="sp"></div><button class="btn" id="say"></button><button class="btn sub" id="next"></button><button class="btn sub" id="end"></button></div><div id="err"></div></div>`;
   $('txt').value = draft; $('txt').oninput = () => { draft = $('txt').value; cnt(); };
   $('txt').onkeydown = (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); say(); } };
   $('say').onclick = say; $('next').onclick = next; $('end').onclick = end;
  }
  $('dt').textContent = S.date ? L(`게임 날짜 ${S.date}`, `Game date ${S.date}`) : '';
  $('stage').classList.toggle('busy', busy);
  $('seats').innerHTML = seat('rep', '', s.reporter, s.outlet) + seat('lead', S.leader, S.empire || L('플레이어 제국', 'Player empire'), L('제국 지도자', 'Imperial leader'));
  const tp = $('topics'); tp.innerHTML = '';
  s.topics.forEach((t, i) => {
   if (t.gov) { const h = document.createElement('p'); h.className = 'sec'; h.textContent = L('정부 발표 · 인터뷰마다 한 번', 'GOVERNMENT ANNOUNCEMENT · ONCE'); tp.appendChild(h); }
   const b = document.createElement('button'); b.className = 'topic ' + t.status + (t.gov ? ' gov' : ''); b.disabled = busy || !(t.status === 'open' || t.status === 'active') || (s.current >= 0 && s.current !== i);
   b.innerHTML = `<b>${esc(t.title)}</b><span>${esc(t.status === 'open' ? (t.source || t.question) : (t.verdict || t.question))}</span><em>${statusLabel(t, S.step)}</em>`;
   b.onclick = async () => { if (s.current === i) return; err(''); const r = await window.sllm.pressPick(i); if (!r.ok) err(r.error); };
   tp.appendChild(b);
   if (t.gov && s.gov && s.gov.card) { const n = document.createElement('div'); n.className = 'govnote'; n.textContent = L(`칙령 후보: 「${s.gov.card.title}」 — ${s.gov.card.name}(${s.gov.card.strength}). 인터뷰를 끝낼 때 확인 카드에서 확정합니다.`, `Edict draft: "${s.gov.card.title}" — ${s.gov.card.name} (${s.gov.card.strength}). Confirm it on the card when you end the interview.`); tp.appendChild(n); }
   else if (t.gov && s.gov && s.gov.policy && t.status === 'open') { const n = document.createElement('div'); n.className = 'govnote'; n.textContent = L(`발표하지 않은 집무실 정책: 「${s.gov.policy}」 — 여기서 발표하고 호평받으면 다음 불이익 1번 면제.`, `Unannounced office policy: "${s.gov.policy}" — announce it here; a good reception waives its next penalty.`); tp.appendChild(n); }
  });
  $('rules').innerHTML = s.scandal === 'hearing' ? L('의혹 주제를 눌러 질문을 받으세요. 답변 횟수 제한은 없습니다.<br>[인터뷰 종료] = 편집국이 해명을 평가합니다(설득력 없으면 생산 −9%·민심 −4). 상대 관계 하락은 그대로입니다.', 'Click the topic to take the question. No limit on answers.<br>[End interview] = the desk rates your explanation (if unconvincing: output −9%, mood −4). The drop in relations stands either way.') : s.scandal ? L('추문 주제를 눌러 질문을 받으세요. 답변 횟수 제한은 없습니다.<br>[인터뷰 종료] = 편집국이 해명을 평가합니다(설득력 있으면 민심 +6, 아니면 −4).', 'Click the scandal topic to take the question. No limit on answers.<br>[End interview] = the desk rates your explanation (mood +6 if convincing, −4 if not).') : L(`주제를 눌러 질문을 받으세요. 답변 횟수 제한은 없습니다.<br>[다음 주제로] = 지금 주제 평가(호평 +${S.step}%)<br>[인터뷰 종료] = 합산 효과 1년 적용 · 벌점 없음<br>✦ 정부 발표 = 칙령(행복도와 따로, 확인 카드에서 확정)`, `Click a topic to take its question. No limit on answers.<br>[Next topic] = rate this topic (well received +${S.step}%)<br>[End interview] = apply the total for 1 year · no penalty<br>✦ Government announcement = edict (separate from happiness, confirmed on a card)`);
  const log = $('log'); log.innerHTML = ''; let lastTopic = -2;
  s.log.forEach((l) => {
   if (l.topic !== lastTopic) { lastTopic = l.topic; const h = document.createElement('div'); h.className = 'topichead'; h.textContent = s.topics[l.topic] ? s.topics[l.topic].title : ''; log.appendChild(h); }
   const d = document.createElement('div'); d.className = 'msg ' + l.who + (l.who === 'desk' && /\+\d+%/.test(l.text) && !/\+0%/.test(l.text) ? ' good' : '');
   const w = document.createElement('b'); w.textContent = l.who === 'player' ? (S.empire || L('지도자', 'Leader')) : l.who === 'reporter' ? `${s.reporter} · ${s.outlet}` : L('편집국', 'Editorial desk');
   const t = document.createElement('div'); t.textContent = l.text; d.append(w, t); log.appendChild(d);
  });
  if (!s.log.length) { const d = document.createElement('div'); d.className = 'msg desk'; d.textContent = L('왼쪽에서 먼저 이야기할 주제를 고르세요.', 'Pick a topic on the left to begin.'); log.appendChild(d); }
  log.scrollTop = log.scrollHeight;
  const active = s.current >= 0;
  $('txt').disabled = busy || !active; $('txt').placeholder = active ? L('기자의 질문에 답하세요. (Ctrl+Enter 로 보내기)', 'Answer the reporter. (Ctrl+Enter to send)') : L('먼저 왼쪽에서 주제를 고르세요.', 'Pick a topic on the left first.');
  $('say').textContent = busy ? L('처리 중…', 'Working…') : L('답하기', 'Answer'); $('say').disabled = busy || !active;
  $('next').textContent = L('다음 주제로', 'Next topic'); $('next').disabled = busy || !active;
  $('end').textContent = L('인터뷰 종료', 'End interview'); $('end').disabled = busy;
  cnt(); $('err').textContent = lastErr;
 }
 function cnt() { const c = $('cnt'); if (c) c.textContent = L(`${draft.trim().length} / 1200자`, `${draft.trim().length} / 1200 characters`); }
 async function run(fn) { if (busy) return; err(''); busy = true; draw(); try { const r = await fn(); if (r && !r.ok) err(r.error); return r; } catch (e) { err(String(e)); } finally { busy = false; draw(); } }
 async function say() { const v = $('txt').value.trim(); if (!v) return; const r = await run(() => window.sllm.pressSay(v)); if (r && r.ok) { draft = ''; if ($('txt')) $('txt').value = ''; cnt(); } }
 function next() { return run(() => window.sllm.pressNext()); }
 function end() {
  const s = S && S.sess; if (!s) return;
  const open = s.topics.filter((t) => t.status === 'open' && !t.gov).length;
  if (open && !confirm(L(`아직 다루지 않은 주제가 ${open}개 있습니다. 인터뷰를 끝낼까요? (다루지 않은 주제는 효과가 없습니다)`, `${open} topics are not covered yet. End the interview? (Uncovered topics give no effect)`))) return;
  return run(async () => { const r = await window.sllm.pressEnd(); if (r && r.confirm) { showCard(); return { ok: true }; } return r; });
 }
 // 칙령 확인 카드: 확정해야 게임에 들어간다(2026-10-18).
 let cardYears = 2;
 function showCard() {
  const c = S && S.sess && S.sess.gov && S.sess.gov.card; if (!c) return;
  cardYears = c.defYears || 2;
  const bg = document.createElement('div'); bg.id = 'cardbg'; document.body.appendChild(bg);
  const paint = (msg) => {
   bg.innerHTML = `<div id="card" role="dialog" aria-modal="true"><div class="seal">✦</div><div class="k">${L('칙령 확인', 'EDICT CONFIRMATION')}</div><h3>${esc(L(`칙령: ${c.title}`, `Edict: ${c.title}`))}</h3><div class="sub">${esc(c.name)} · ${esc(c.strength)}</div>`
    + (c.positive ? '' : `<p class="warn">${L('기자 반응이 냉담해 국내 이득이 한 단계 줄었습니다.', 'The press reception was cold, so the domestic gains are one step lower.')}</p>`)
    + `<ul>${c.lines.map((l) => `<li class="${l.c}">${esc(l.t)}</li>`).join('')}</ul>`
    + `<div class="yrs"><span>${L('시행 기간', 'Duration')}</span>${c.years.map((y) => `<label class="${y === cardYears ? 'on' : ''}"><input type="radio" name="cy" value="${y}" ${y === cardYears ? 'checked' : ''}> ${esc(L(`${y}년`, y === 1 ? '1 year' : `${y} years`))}</label>`).join('')}</div>`
    + (c.replaces ? `<p class="warn">${esc(L(`시행 중인 칙령 「${c.replaces}」를 대신합니다(그 효과는 사라짐).`, `Replaces the edict in force, "${c.replaces}" (its effects end).`))}</p>` : '')
    + `<div class="btns"><button id="cBack">${L('돌아가기', 'Back')}</button><button id="cSkip">${L('칙령 없이 종료', 'End without edict')}</button><button class="ok" id="cOk">${L('확정하고 인터뷰 종료', 'Confirm and end interview')}</button></div><div class="err" id="cErr">${esc(msg || '')}</div></div>`;
   bg.querySelectorAll('input[name=cy]').forEach((r) => { r.onchange = () => { cardYears = Number(r.value); paint(); }; });
   const close = () => bg.remove();
   const go = async (edict) => { bg.querySelectorAll('button').forEach((b) => { b.disabled = true; }); try { const r = await window.sllm.pressEnd({ edict, years: cardYears }); if (r && r.ok) close(); else paint((r && r.error) || ''); } catch (e) { paint(String(e)); } };
   $('cBack').onclick = close; $('cSkip').onclick = () => go('skip'); $('cOk').onclick = () => go('apply');
  };
  paint('');
 }
 function draw() { if (!S) return; head(); if (S.sess) drawRoom(); else drawIdle(); }
 $('x').onclick = () => window.sllm.pressClose();
 window.sllm.onPressState((s) => { S = s; if (!s.sess && mode === 'room') mode = ''; draw(); });
 window.sllm.onTheme((t) => applyTheme(t.theme, t.custom));
 window.sllm.onLanguageChanged(() => { mode = ''; draw(); });
 document.addEventListener('sllm-language', () => { mode = ''; draw(); });
 window.sllm.getSettings().then((st) => { if (st && st.theme) applyTheme(st.theme, st.custom); }).catch(() => {});
 window.sllm.pressState().then((s) => { S = s; draw(); });
</script></body></html>
