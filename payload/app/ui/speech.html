<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>연설</title>
<style>
 :root{--bg:#06141b;--panel:#0b2230;--text:#dcecf0;--dim:#7fa3ad;--hi:#5fd4e4;--hi-text:#04161d;--gold:#e8c872;--linec:#5fd4e4;--good:#7bd88f;--bad:#e88;
  --line:color-mix(in srgb,var(--linec) 34%,transparent);--line2:color-mix(in srgb,var(--linec) 15%,transparent);--glow:95,212,228}
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.6 "Malgun Gothic",sans-serif;overflow:hidden}
 body{display:flex;flex-direction:column;border:1px solid var(--line)}
 button,textarea{font:inherit;color:inherit}
 #head{-webkit-app-region:drag;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
 #emb{width:30px;height:30px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700;transform:rotate(45deg);margin:0 6px}
 #emb span{transform:rotate(-45deg)}
 #head b{color:var(--hi);letter-spacing:.14em} #head .t{display:flex;flex-direction:column;line-height:1.25} #head small{color:var(--dim)} #head .sp{flex:1}
 #x{-webkit-app-region:no-drag;background:none;border:1px solid transparent;color:var(--dim);width:26px;height:22px;cursor:pointer;padding:0} #x:hover{border-color:var(--line);color:var(--text)}
 #main{flex:1;min-height:0;display:flex;flex-direction:column}
 .pad{padding:16px 22px;overflow-y:auto;flex:1}
 h2{margin:0 0 6px;font-size:15px;color:var(--gold);letter-spacing:.08em;font-weight:600}
 .hint{color:var(--dim);font-size:12px;margin:0 0 10px}
 .crowdinfo{border:1px solid var(--line2);background:color-mix(in srgb,var(--panel) 60%,transparent);padding:8px 12px;margin:0 0 14px;font-size:12px}
 .crowdinfo b{color:var(--hi)} .crowdinfo ul{margin:4px 0 0;padding-left:18px;color:var(--dim)}
 #types{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
 .ty{border:1px solid var(--line);background:var(--panel);padding:16px 10px;cursor:pointer;text-align:center;border-radius:3px}
 .ty:hover{border-color:var(--hi);box-shadow:0 0 14px rgba(var(--glow),.25)} .ty b{display:block;font-size:16px;margin-bottom:5px} .ty span{font-size:11.5px;color:var(--dim);line-height:1.45;display:block}
 .ty em{display:block;margin-top:8px;font-style:normal;font-size:11.5px;color:var(--gold)} .ty em.good{color:var(--good)} .ty em.bad{color:var(--bad)}
 .ty:focus-visible,.btn:focus-visible,#txt:focus-visible,.tg:focus-visible{outline:2px solid var(--hi)}
 .btn{padding:8px 20px;border:1px solid var(--hi);background:color-mix(in srgb,var(--hi) 16%,transparent);color:var(--hi);cursor:pointer;letter-spacing:.06em}
 .btn:hover:not(:disabled){background:color-mix(in srgb,var(--hi) 28%,transparent)} .btn:disabled{opacity:.45;cursor:default}
 .btn.sub{border-color:var(--line);color:var(--dim);background:none} .btn.sub:hover:not(:disabled){color:var(--text);border-color:var(--hi);background:none}
 /* 연설 무대 */
 #talk{flex:1;min-height:0;display:grid;grid-template-columns:clamp(150px,17.5vw,210px) minmax(0,1fr) clamp(190px,22.5vw,270px)}
 #left,#right{padding:10px 12px;overflow-y:auto;background:color-mix(in srgb,var(--panel) 55%,transparent)}
 #left{border-right:1px solid var(--line2)} #right{border-left:1px solid var(--line2)}
 .sec{font-size:11px;color:var(--dim);letter-spacing:.14em;margin:0 0 6px}
 #left details{margin:0 0 10px;font-size:12px;color:var(--dim)} #left summary{cursor:pointer;color:var(--text)} #left ul{margin:4px 0 0;padding-left:16px}
 .step{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim);margin:3px 0} .step i{width:8px;height:8px;border:1px solid var(--dim);border-radius:50%} .step.on{color:var(--text)} .step.on i{background:var(--gold);border-color:var(--gold)} .step.done i{background:var(--dim)}
 #gauge{position:relative;height:12px;border:1px solid var(--line);background:linear-gradient(90deg,#5a2a2a,#243038 50%,#245a3a);margin:6px 0 2px}
 #gauge i{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;background:var(--gold);box-shadow:0 0 6px var(--gold);transition:left .8s ease}
 #gauge u{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#fff4}
 #gm{font-size:12px;color:var(--dim)} #gm b{color:var(--text)}
 #stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 18%,rgba(var(--glow),.18),transparent 60%),linear-gradient(#071b26,#04101a 70%,#020a10);transition:background .8s}
 #stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 12% 20%,#fff8,transparent),radial-gradient(1px 1px at 78% 14%,#fff7,transparent),radial-gradient(1.5px 1.5px at 40% 9%,#fff9,transparent),radial-gradient(1px 1px at 90% 38%,#fff6,transparent),radial-gradient(1px 1px at 22% 44%,#fff6,transparent),radial-gradient(1.5px 1.5px at 62% 30%,#fffa,transparent)}
 #planet{position:absolute;right:-60px;top:-70px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(var(--glow),.55),rgba(var(--glow),.12) 55%,transparent 70%);opacity:.5}
 /* A-23 연설 무대: 가치관에 따라 장소가 바뀐다(speech.ts speechStage) */
 #venue{position:absolute;left:10px;top:8px;z-index:2;font-size:11px;letter-spacing:.12em;color:var(--dim);background:#0008;padding:2px 8px;border:1px solid var(--line2)}
 /* A-22 연출 슬롯: 사용자 무대 그림. 이 무대 전용 그림이 있으면 그것, 없으면 모든 무대 공통 그림 */

 #stage .scenebg::after{content:"";position:absolute;inset:0;background:linear-gradient(#0005,transparent 40%,#000a)}
 html:not([data-scene]) #stage .scenebg{display:none} html[data-scene] #stage::before,html[data-scene] #stage::after{display:none}
 #stage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55}
 #stage[data-stage=podium]{background:radial-gradient(ellipse at 50% 22%,#a8262655,transparent 58%),linear-gradient(#1c0b0b,#0e0505 70%,#050202)}
 #stage[data-stage=podium]::after{background:linear-gradient(90deg,transparent 6%,#8c1c1c 6%,#8c1c1c 11%,transparent 11%,transparent 89%,#8c1c1c 89%,#8c1c1c 94%,transparent 94%);mask-image:linear-gradient(#000 0,#000 62%,transparent 72%)}
 #stage[data-stage=podium] #podium{bottom:38%}
 #mics{position:absolute;left:50%;width:120px;margin-left:-60px;bottom:calc(38% + 56px);z-index:2;pointer-events:none}

 #stage[data-stage=parade]::after{background:repeating-linear-gradient(90deg,transparent 0 46px,#c9b04a33 46px 50px);mask-image:linear-gradient(transparent 30%,#000 55%,transparent 70%)}
 #stage[data-stage=garden]{background:radial-gradient(ellipse at 50% 18%,#6fd89a44,transparent 60%),linear-gradient(#0b1f17,#07140f 70%,#030a07)}
 #stage[data-stage=temple]{background:radial-gradient(ellipse at 50% 30%,#d8b45a55,transparent 45%),radial-gradient(ellipse at 50% 10%,#8a4ad855,transparent 70%),linear-gradient(#180f22,#0d0814 70%,#05030a)}
 #stage[data-stage=temple]::after{background:radial-gradient(ellipse 30% 55% at 50% 60%,transparent 70%,#d8b45a33 71%,transparent 74%)}
 #stage[data-stage=academy]{background:radial-gradient(ellipse at 50% 18%,#5fe4d055,transparent 60%),linear-gradient(#08201e,#051412 70%,#020a09)}
 #stage[data-stage=academy]::after{background:linear-gradient(#5fe4d018 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,#5fe4d018 1px,transparent 1px) 0 0/28px 28px;mask-image:linear-gradient(#000,transparent 65%)}
 #stage[data-stage=forum]{background:conic-gradient(from 200deg at 50% 25%,#d85a5a33,#d8b45a33,#6fd89a33,#5a8ad833,#b45ad833,#d85a5a33),linear-gradient(#141420,#0a0a12 70%,#040408)}
 #stage[data-stage=bastion]{background:radial-gradient(ellipse at 50% 22%,#7a2a2a44,transparent 55%),linear-gradient(#16151a,#0c0b0e 70%,#040405)}
 #stage[data-stage=bastion]::after{background:repeating-linear-gradient(90deg,#3a383e55 0 60px,#2a282e55 60px 62px);mask-image:linear-gradient(transparent 20%,#000 30%,#000 52%,transparent 56%)}
 #stage[data-stage=core]{background:radial-gradient(ellipse at 50% 30%,#00e5ff33,transparent 55%),linear-gradient(#020a0e,#01060a 70%,#000)}
 #stage[data-stage=core]::after{background:linear-gradient(#00e5ff22 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,#00e5ff22 1px,transparent 1px) 0 0/16px 16px}
 #stage[data-stage=nexus]{background:radial-gradient(circle at 30% 40%,#e8a05a33,transparent 30%),radial-gradient(circle at 70% 35%,#e85a9a33,transparent 28%),radial-gradient(ellipse at 50% 20%,#e8c87244,transparent 60%),linear-gradient(#1a0f0c,#0e0806 70%,#050302)}
 #subtitle{position:absolute;left:6%;right:6%;top:7%;text-align:center;font-size:clamp(18px,2.3vw,28px);line-height:1.5;font-weight:600;text-shadow:0 2px 14px #000;min-height:3em;transition:opacity .4s}
 #subtitle.wait{opacity:.6;animation:pulse 1.4s ease-in-out infinite} #subtitle small{display:block;font-size:11px;font-weight:400;color:var(--dim);letter-spacing:.2em;margin-bottom:6px}
 @keyframes pulse{50%{opacity:.3}}
 #podium{position:absolute;left:50%;bottom:30%;width:150px;margin-left:-75px}
 #lead{width:104px;height:124px;margin:0 auto -14px;position:relative;z-index:1;border:2px solid var(--gold);border-radius:52px 52px 6px 6px;overflow:hidden;background:#0c2a36;box-shadow:0 0 18px rgba(var(--glow),.35)} #lead img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
 #podium svg{width:100%;height:auto;display:block}
 #crowd{position:absolute;left:0;right:0;bottom:0;height:34%;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding-bottom:6px;background:linear-gradient(transparent,#00000080);transition:filter .8s}
 .row{display:flex;justify-content:center;gap:5px}
 .fg{width:16px;height:26px;position:relative;flex:none;--d:0s}
 .fg::before{content:"";position:absolute;left:3px;top:0;width:10px;height:10px;border-radius:50%;background:currentColor}
 .fg::after{content:"";position:absolute;left:0;top:11px;width:16px;height:15px;border-radius:7px 7px 2px 2px;background:currentColor;opacity:.85}
 .row:nth-child(1) .fg{transform:scale(.8);opacity:.55} .row:nth-child(2) .fg{transform:scale(.92);opacity:.75}
 #crowd{color:#3d7183}
 #crowd.machine .fg::before{border-radius:2px} #crowd.machine .fg::after{border-radius:2px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
 #crowd.machine{color:#52a2b5} #crowd.machine .fg{animation:sync 1.6s steps(2) infinite}
 #crowd.hive{color:#6fa86a} #crowd.hive .fg{animation:hum 2.6s ease-in-out infinite} #crowd.hive .fg::after{border-radius:50% 50% 30% 30%}
 @keyframes sync{50%{opacity:.35}} @keyframes hum{50%{transform:translateY(-3px)}}
 #crowd.cheer{color:#9be6a8;filter:drop-shadow(0 0 8px #7bd88f)} #crowd.cheer .fg{animation:hop .6s ease-in-out 3;animation-delay:var(--d)}
 @keyframes hop{50%{transform:translateY(-9px)}}
 #crowd.jeer{color:#d98585;filter:drop-shadow(0 0 6px #e88)} #crowd.jeer .fg{animation:jit .12s linear 8;animation-delay:var(--d)}
 @keyframes jit{25%{margin-left:2px}75%{margin-left:-2px}}
 #crowd.hush{filter:brightness(.55)}
 #flash{position:absolute;inset:0;pointer-events:none;opacity:0}
 #flash.c{background:radial-gradient(ellipse at 50% 90%,#7bd88f66,transparent 65%);animation:fl 1.1s ease-out}
 #flash.j{background:radial-gradient(ellipse at 50% 90%,#e8888866,transparent 65%);animation:fl 1.1s ease-out}
 @keyframes fl{0%{opacity:1}100%{opacity:0}}
 .rc{margin:0 0 7px;padding:5px 8px;border-left:2px solid var(--line);font-size:12.5px;animation:in .35s ease both} @keyframes in{from{opacity:0;transform:translateY(3px)}}
 .rc .nm{display:block;font-size:10.5px;color:var(--dim)}
 .rc.cheer{border-color:var(--good);color:var(--good)} .rc.cheer::before{content:"📣 "} .rc.jeer{border-color:var(--bad);color:var(--bad)} .rc.jeer::before{content:"💢 "}
 .rc.action{color:var(--dim);font-style:italic;border-color:var(--line2)} .rc.action::before{content:"＊ "} .rc.action::after{content:" ＊"}
 .tr{font-size:11.5px;color:var(--dim);margin:0 0 8px;letter-spacing:.08em} .tr.up{color:var(--good)} .tr.down{color:var(--bad)}
 .tg{margin-top:8px;background:none;border:1px solid var(--line);color:var(--dim);padding:3px 10px;cursor:pointer;font-size:11.5px} .tg:hover{color:var(--text);border-color:var(--hi)}
 #hist{position:absolute;inset:0;background:#04101aee;overflow-y:auto;padding:14px 18px;display:none;z-index:3} #hist.on{display:block}
 #hist .p{color:var(--hi);margin:8px 0 3px}
 #in{border-top:1px solid var(--line);padding:8px 14px;background:var(--panel)}
 #txt{width:100%;min-height:70px;max-height:150px;resize:vertical;padding:9px;background:var(--bg);border:1px solid var(--line);color:var(--text);line-height:1.5}
 #row2{display:flex;align-items:center;gap:8px;margin-top:6px} #row2 .sp{flex:1} #cnt{font-size:11px;color:var(--dim)} #cnt.bad{color:var(--bad)} #left2{font-size:12px;color:var(--dim)}
 #msg{font-size:12px;color:var(--gold);min-height:16px;margin-top:3px} #msg.err{color:var(--bad)}
 .note{padding:40px 8px;text-align:center;color:var(--dim)}
 #result .grade{font-size:34px;font-weight:700;letter-spacing:.1em;color:var(--gold);margin:6px 0}
 #result .buff{margin:8px 0 16px;font-size:13px}
 /* A-25 연설문 작성(선택) */
 #draftBox{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#02080ce0;padding:20px}
 #draftBox .card{width:min(760px,94%);border:1px solid var(--line);background:var(--panel);padding:16px 18px}
 /* A-25 연설문(2026-10-15 사용자 21:40): 먼저 따로 뜨는 작성 창에서 쓰고 → 연설 시작. 연설 중에는 옆에 접을 수 있는 연설문. 줄 쳐진 종이 노트 */
 .lined{--lh:30px;color:#2b2a33;background:
   linear-gradient(90deg,transparent 46px,#e2a3a0 46px 48px,transparent 48px),
   repeating-linear-gradient(to bottom,transparent 0 calc(var(--lh) - 1px),#a9c3da calc(var(--lh) - 1px) var(--lh)),
   radial-gradient(ellipse at 20% 10%,#fffdf6,transparent 60%),radial-gradient(ellipse at 80% 90%,#efe5cc,transparent 55%),#f7f1e1;
   background-attachment:local,local,scroll,scroll,scroll;box-shadow:inset 0 0 40px #c9b88a55}
 .lined input,.lined textarea{color:#2b2a33;background:transparent;border:0;outline:none;font-family:"Noto Serif KR","Batang","Malgun Gothic",serif}
 .lined .ttl{width:100%;padding:0 14px 0 58px;height:calc(var(--lh) * 2);line-height:calc(var(--lh) * 2);font-size:21px;font-weight:700;letter-spacing:.02em}
 .lined .ttl::placeholder,.lined textarea::placeholder{color:#9a917c;font-weight:400}
 .lined textarea{display:block;width:100%;resize:none;padding:7px 14px 0 58px;font-size:16px;line-height:var(--lh)}
 #writer{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:#02080ce6;padding:18px}
 #writer .pad{width:min(820px,96%);height:min(92%,760px);display:flex;flex-direction:column;border-radius:3px;box-shadow:0 18px 60px #000c,0 0 0 1px #00000040;overflow:hidden}
 #writer .lined{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto;padding-top:var(--lh)}
 #writer .lined textarea{flex:1;min-height:calc(var(--lh) * 14)}
 #writer .wbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#2b2418;color:#e9dfc6}
 #writer .wbar .sp{flex:1} #writer .wbar .hint{color:#c9bc9a}
 #memo{position:absolute;left:12px;top:56px;bottom:150px;width:min(380px,36%);z-index:5;display:flex;flex-direction:column;border-radius:3px;overflow:hidden;box-shadow:0 8px 28px #000b;transition:width .2s}
 #memo .mh{display:flex;align-items:center;gap:8px;padding:5px 10px;background:#2b2418;color:#e9dfc6} #memo .mh .sp{flex:1} #memo .mh .hint{color:#c9bc9a}
 #memo .lined{flex:1;min-height:0;overflow:auto} #memo .lined textarea{min-height:100%;height:auto}
 #memo.fold{width:auto;bottom:auto} #memo.fold .lined{display:none} #memo.fold .mh b::after{content:" (접힘)";font-weight:400;color:#c9bc9a}
 #draftBox .rowb{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:10px} #draftBox .rowb .sp{flex:1}
 #fin{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:#02080cd0;text-align:center;padding:20px}
 #fin .box{max-width:460px;animation:in .6s ease both}
 @media (max-width:900px){#left,#right{padding:8px} #types{grid-template-columns:repeat(2,1fr)}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><script src="theme.js"></script><script src="scene-slots.js"></script><script src="i18n-catalog.js"></script><script src="i18n-ui.js"></script><link rel="stylesheet" href="window-chrome.css"><link rel="stylesheet" href="special-rooms.css"><link rel="stylesheet" href="speech-art.css"></head><body data-room="speech">
<div id="head"><div id="emb" aria-hidden="true"><span id="embc">★</span></div><div class="t"><b id="ht">연 설</b><small id="hs"></small></div><span class="sp"></span><small id="hd"></small><span id="sceneBtn"></span><button id="x" title="닫기 (연설은 그대로 남아 있습니다)">✕</button></div>
<div id="main"></div>
<script>
 const $ = (i) => document.getElementById(i), M = $('main');
 const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
 let S = null, busy = false, result = null, draft = '', lastDelta = null, view = '', cur = null, shown = 0, histOn = false, draftAsked = false, speechDraft = '';
 const L = (ko, en) => (window.SLLMI18n && window.SLLMI18n.pick ? window.SLLMI18n.pick(ko, en) : ko);
 const years = (d) => d % 360 === 0 ? (d / 360) + L('년', ' yr') : Math.round(d / 30) + L('개월', ' mo');
 const moodLabel = (m) => m >= 55 ? L('열광', 'Enthusiastic') : m >= 30 ? L('호응', 'Responsive') : m >= 8 ? L('무난', 'Fair') : m > -20 ? L('냉담', 'Cold') : L('싸늘함', 'Chilly');
 const arrow = (d) => d >= 8 ? ['▲▲ 크게 호응', 'up'] : d >= 3 ? ['▲ 호응', 'up'] : d <= -8 ? ['▼▼ 크게 싸늘', 'down'] : d <= -3 ? ['▼ 싸늘', 'down'] : ['― 큰 변화 없음', ''];
 $('x').onclick = () => window.sllm.speechClose();
 window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.sllm.speechClose(); });
 const crowdBox = () => `<div class="crowdinfo"><b>국민 성향</b> · ${esc(S.crowd.summary)}<ul>${S.crowd.lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul></div>`;
 function head() { $('hd').textContent = S && S.date ? '게임 날짜 ' + S.date : ''; $('embc').textContent = S && S.empire ? [...S.empire][0] : '★'; $('ht').textContent = S && S.empire ? S.empire + ' · 연설' : '연 설'; }

 function draw() {
   if (!S || result) return; head();
   if (S.phase !== 'ready') { view = 'note'; M.innerHTML = `<div class="note">${S.phase === 'prep' ? L(`연설을 준비하는 중입니다.<br>게임 날짜 ${esc(S.due)} 에 준비가 끝납니다(현재 ${esc(S.date || '?')}).`, `The speech is being prepared.<br>It will be ready on game date ${esc(S.due)} (now ${esc(S.date || '?')}).`) : L('준비된 연설이 없습니다.<br>제국 탭의 결정에서 "연설 준비"를 누르면 3개월 뒤 연설할 수 있습니다.', 'There is no speech ready.<br>Press "Prepare speech" under Decisions in the Empire tab to give one 3 months later.')}</div>`; $('hs').textContent = ''; return; }
   if (!S.sess || (S.sess.turns === 0 && view !== 'talk')) return drawChoose();
   drawTalk();
 }
