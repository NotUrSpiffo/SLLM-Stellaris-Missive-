 html[data-surface=display] #sheet{border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 60px #0008}

 @media(max-width:600px){#sheet{padding:20px 20px 26px}.masthead-title{font-size:clamp(28px,7vw,42px)}}

  if (!it) { const dsp = surface() === 'display', cv = (k, d) => { const x = getComputedStyle(document.documentElement).getPropertyValue(k).trim(); return /^#[0-9a-f]{6}$/i.test(x) ? x : d; }, ink0 = dsp ? cv('--text', '#dcecf0') : '#1d1a14', mute0 = dsp ? cv('--dim', '#8fb3bd') : '#4a4333'; document.body.style.background = dsp ? 'linear-gradient(#ffffff06 1px,transparent 1px) 0 0/100% 4px,radial-gradient(ellipse at 50% 0,' + cv('--hi', '#5fd4e4') + '26,transparent 60%),' + cv('--bg', '#06141b') : '#ece3cd'; document.documentElement.style.setProperty('--pbg', dsp ? cv('--bg', '#06141b') : '#ece3cd'); $('dock').style.color = ink0; sheet.style.cssText = 'color:' + ink0 + ';-webkit-app-region:drag'; const h = mk('div', 'display:flex;justify-content:flex-end'); h.append(nav(ink0, mute0)); /* 2026-10-19 집 PC 검수: 집무실(디스플레이)에서 「아직 나온 호가 없습니다」가 종이 색 글자로 나와 안 보이던 것 */ sheet.append(h, mk('div', 'padding:120px 30px;text-align:center;font-size:20px', T('아직 나온 호가 없습니다. 새해(1월 1일)가 되면 지난 한 해의 기록으로 신문이 나옵니다.'))); return; }

   band.className = 'crisis-band'; band.append(mk('span', 'font-size:18px', '⚠ ' + T('은하 위기 특별판') + (window.SLLMI18n && window.SLLMI18n.language() === 'en' ? '' : ' · SPECIAL EDITION')), mk('span', 'font-size:13px;letter-spacing:.06em;font-weight:700', (window.SLLMI18n && window.SLLMI18n.language() === 'en' ? CRI.en : CRI.ko))); // i18n-data: 위기 이름 자료(한/영)·영어 부제는 한국어 화면에만
   sheet.insertBefore(band, m);
  }
  const hd = mk('div', 'padding:26px 0 20px;border-bottom:1px solid ' + ink); hd.append(mk('div', 'font-size:14px;font-weight:700;letter-spacing:.2em;color:' + P.accent + ';margin-bottom:8px', it.extra ? T('호외 · 號外') : T('머리기사')), mk('h1', 'margin:0;font-size:clamp(32px,4.4vw,56px);line-height:1.25;font-weight:900', it.headline)); sheet.append(hd);
  if (it.extra) { // 호외: 기사는 한 건, 나머지 지면은 AI 를 쓰지 않은 날려쓴 가짜 글씨로 채운다
   let seed = (it.id || 1) * 9301 + 49297; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
   const scrib = (rows) => { const box = mk('div', 'color:' + ink + ';opacity:.42;font-style:italic;font-size:17px;line-height:1.9;letter-spacing:.06em;overflow:hidden'); for (let r = 0; r < rows; r++) { let s = ''; const w = 4 + Math.floor(rnd() * 4); for (let k = 0; k < w; k++) s += (k ? ' ' : '') + '~'.repeat(2 + Math.floor(rnd() * 6)); box.append(mk('div', 'white-space:nowrap;transform:rotate(' + ((rnd() - .5) * 1.4).toFixed(2) + 'deg)', s)); } return box; };
   const grid = mk('div', 'display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0'); grid.className = 'news-grid';
   const a = it.articles[0];
   const art = mk('div', 'padding:22px 24px 8px;padding-left:0'); art.className = 'news-article';
   if (a) { art.append(mk('h2', 'margin:0 0 12px;font-size:26px;line-height:1.3;font-weight:900', a.title), mk('div', 'font-size:17px;line-height:1.9;text-align:justify', a.body)); if (a.comment) art.append(mk('div', 'margin-top:12px;font-size:15px', a.comment)); }

   sheet.append(grid);
   const bx = mk('div', 'border-top:4px double ' + ink + ';margin-top:20px;padding-top:14px'); bx.append(scrib(4)); sheet.append(bx);
   sheet.append(mk('div', 'margin-top:20px;padding-top:10px;border-top:1px solid ' + ink + ';font-family:"Malgun Gothic",sans-serif;font-size:12.5px;text-align:right;color:' + mute, T('호외입니다. 기사 한 건만 실었으며 나머지 지면은 모양만 낸 가짜 글씨입니다.')));
   return;
  }
  if (it.articles.length) {
   const n = Math.min(it.articles.length, 3);

    art.className='news-article';
    art.append(mk('h2', 'margin:0 0 12px;font-size:26px;line-height:1.3;font-weight:900', a.title), mk('div', 'font-size:17px;line-height:1.9;text-align:justify', a.body));
    if (a.comment) { const c = mk('div', 'margin-top:16px;padding:12px 14px;background:' + ink + '14;border-left:4px solid ' + P.accent + ';font-size:15px;line-height:1.75'); c.append(mk('div', 'font-family:"Malgun Gothic",sans-serif;font-size:12px;font-weight:700;letter-spacing:.12em;color:' + P.accent + ';margin-bottom:4px', T('기자 논평 · ') + (a.reporter || '')), document.createTextNode(a.comment)); art.append(c); }

   const bg = mk('div', 'display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));column-gap:34px;row-gap:8px;font-size:16px;line-height:1.6'); bg.className='brief-grid'; for (const br of it.briefs) bg.append(mk('div', 'border-bottom:1px dotted ' + ink + '77;padding-bottom:6px', '· ' + br)); bx.append(bg); sheet.append(bx);

 }
 // 은하 위기 특집(2026-10-17): 위기 특별판으로 낸 호(issues)만 특별판 지면. 정기호·일반 호외는 위기 중이라도 평소 지면. 위기 이름은 호마다 저장된 것(labels)
 let crisis = { issues: [], labels: {} };

 async function load() { try { list = await window.sllm.newsList(); } catch (e) { list = []; } pos = 0; render(); $('scroll').scrollTop = 0; }
 document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.sllm.paperClose(); else if (e.key === 'ArrowLeft') $('prev')?.click(); else if (e.key === 'ArrowRight') $('next')?.click(); });
 window.sllm.onGalNews((it) => { list.unshift(it); pos = 0; render(); });

   const top = $('scroll').scrollTop; render(); $('scroll').scrollTop = top;

 // A-22 2단계: 지면 모양. 자동이면 테마를 따른다(기계·물질·평등·홀로그램 테마는 디스플레이, 나머지는 종이). 이 PC에만 저장
 const DISPLAY_THEMES = ['machine', 'materialist', 'egalitarian', 'holo'];

 let surfPick = 'auto'; try { const v = localStorage.getItem('sllm_paper_surface'); if (SURF.includes(v)) surfPick = v; } catch (e) { /* 저장소 없음 */ }
 // 2026-10-18: 여는 곳으로 지면을 고정한다. 오버레이 신문 아이콘(mode=paper) = 종이, 집무실(mode=office) = 디스플레이. 지면 바꾸기 단추는 숨긴다(집무실 유리에서 종이로 바꾸면 글자가 사라졌다).

 if (OPEN_MODE === 'office' && window.sllm.paperBig) { const b = $('bigBtn'); b.hidden = false; b.textContent = T('⤢ 크게 보기'); b.title = T('신문을 큰 창으로 따로 엽니다'); b.onclick = () => window.sllm.paperBig(); }
 // 책상 신문으로 열면: 종이 펼치는 효과 + 작은 종이 소리(소리 파일 없이 짧게 합성, 음량 낮게)
 function rustle() {
  try {
   const C = new (window.AudioContext || window.webkitAudioContext)(), dur = 0.5, n = Math.floor(C.sampleRate * dur), buf = C.createBuffer(1, n, C.sampleRate), d = buf.getChannelData(0);
