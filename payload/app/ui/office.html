<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>집무실</title>
<style>
 /* 집무실(2026-10-18): 나무 벽 집무실, 창 너머 별, 책상의 투사기가 띄운 홀로그램 바탕화면. 색은 테마(--hi 등)를 따른다 */
 :root{--bg:#05090c;--panel:#0b1a22;--text:#dcecf0;--dim:#7fa3ad;--hi:#5fd4e4;--hi-text:#04161d;--gold:#e8c872;--linec:#5fd4e4;--bad:#e0705f;
  --wood:#1c130c;--wood2:#22170e;--frame:#2c2014;
  --glow:color-mix(in srgb,var(--hi) 55%,transparent);--glass:color-mix(in srgb,var(--hi) 7%,#020a10cc);
  --line:color-mix(in srgb,var(--hi) 38%,transparent);--line2:color-mix(in srgb,var(--hi) 16%,transparent)}
 body.crisis{--hi:#ff5a4a;--linec:#ff5a4a}
 *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.6 "Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:hidden}
 button{font:inherit;color:inherit;cursor:pointer}
 :focus-visible{outline:2px solid var(--hi);outline-offset:2px}

 /* 방 */
 #room{position:fixed;inset:0;background:linear-gradient(90deg,var(--wood) 0 5%,transparent 5% 95%,var(--wood) 95%),repeating-linear-gradient(90deg,var(--wood2) 0 52px,var(--wood) 52px 104px)}
 #sky{position:absolute;left:9%;right:9%;top:4%;height:40%;border:7px solid var(--frame);border-radius:3px;box-shadow:inset 0 0 50px #000d,0 0 0 2px #120c07;
  background:radial-gradient(1px 1px at 9% 24%,#fffa,transparent),radial-gradient(1px 1px at 31% 12%,#fff8,transparent),radial-gradient(1.5px 1.5px at 47% 33%,#fff,transparent),radial-gradient(1px 1px at 66% 20%,#fff9,transparent),radial-gradient(1px 1px at 83% 58%,#fff8,transparent),radial-gradient(1px 1px at 22% 66%,#fff7,transparent),radial-gradient(1px 1px at 92% 14%,#fff8,transparent),radial-gradient(ellipse at 74% 125%,#3a5a8a55,transparent 60%),linear-gradient(#02060e,#06122a)}
 #sky::before,#sky::after{content:"";position:absolute;background:var(--frame)} #sky::before{left:33.3%;top:0;bottom:0;width:6px} #sky::after{left:66.6%;top:0;bottom:0;width:6px}
 #desk{position:absolute;left:-3%;right:-3%;bottom:0;height:17%;background:linear-gradient(#3a2818,#24180e 45%,#140d07);border-top:3px solid #4a3420;box-shadow:0 -12px 34px #000a}
 #proj{position:absolute;left:50%;bottom:calc(17% - 9px);width:180px;height:20px;margin-left:-90px;border-radius:50%;background:radial-gradient(ellipse,color-mix(in srgb,var(--hi) 75%,#fff) 0,var(--glow) 42%,#0000 72%),#0c0c0c;box-shadow:0 0 34px var(--glow)}
 #beam{position:absolute;left:50%;bottom:17%;width:min(1100px,84vw);height:calc(83% - 52px);transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(to top,color-mix(in srgb,var(--hi) 26%,transparent),transparent 70%);clip-path:polygon(46% 100%,54% 100%,100% 0,0 0);opacity:.35}

 /* 윗줄(창 끌기·닫기) */
 #bar{position:fixed;left:0;right:0;top:0;height:34px;z-index:5;-webkit-app-region:drag;display:flex;align-items:center;gap:12px;padding:0 12px;background:linear-gradient(#0009,#0000);color:#cdb79a;font-size:13px}
 #bar b{font-weight:700;letter-spacing:.06em;color:#e2cfae} #bar .sp{flex:1}
 #x{-webkit-app-region:no-drag;background:none;border:1px solid transparent;color:#b9a487;width:28px;height:24px;padding:0;border-radius:3px} #x:hover{border-color:#5a4630;color:#fff}

 /* 홀로그램 화면 */
 #holo{position:absolute;left:50%;top:7%;width:min(1040px,80vw);height:calc(83% - 7% - 46px);transform:translateX(-50%);
  display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--hi) 10%,transparent),0 0 46px color-mix(in srgb,var(--hi) 22%,transparent),inset 0 0 70px color-mix(in srgb,var(--hi) 10%,transparent);
  -webkit-mask-image:linear-gradient(#000 88%,#0008);mask-image:linear-gradient(#000 88%,#0008);overflow:hidden}
 #holo::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,color-mix(in srgb,var(--hi) 5%,transparent) 3px 4px);z-index:3}
 #hh{display:flex;align-items:center;gap:14px;padding:12px 20px 10px;border-bottom:1px solid var(--line2)}
 #emp{font-size:17px;font-weight:700;color:var(--gold);text-shadow:0 0 10px color-mix(in srgb,var(--gold) 40%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #hh .sp{flex:1}
 /* 집무실 컴퓨터 안에서 연 창: 본문 자리에 그 창이 붙고, 머리줄에 돌아가기와 이름이 뜬다 */
 #run{display:none;align-items:center;gap:10px} body.docked #run{display:flex} body.docked #emp{display:none}
 #runName{font-weight:700;color:var(--hi)}
 body.docked #holo{bottom:calc(var(--emitter-bottom,17%) + 12px)!important;height:auto} /* 창을 붙였을 때는 투사기 바로 위까지 화면을 늘려 본문 자리를 넓힌다 */
 body.docked #holo{background:linear-gradient(180deg,#06182466,#06252e40 75%,#13546630)!important;-webkit-mask-image:none!important;mask-image:none!important} /* 붙은 창이 반투명하므로 뒤 홀로그램도 유리처럼 비워 둔다 */

 /* 책상 위 접힌 신문(2026-10-18): 누르면 종이 지면 신문이 큰 창으로 펼쳐진다. 배경 그림(cover, 아래 기준)의 책상 오른쪽 빈자리에 맞춰 화면비와 함께 움직인다 */
 #deskPaper{position:fixed;z-index:3;left:calc(50% + .18 * max(100vw, 133.3vh));bottom:max(17vh, 12.75vw);width:calc(.085 * max(100vw, 133.3vh));aspect-ratio:1.3;padding:0;border:0;background:none;cursor:pointer;transform:translateX(-50%);-webkit-app-region:no-drag}
 #deskPaper .np{position:absolute;inset:0;display:block;background:linear-gradient(#f1e8d2,#ddd0b0);border-radius:1px;transform:rotate(-7deg) skewX(-30deg) scaleY(.5);transform-origin:50% 100%;box-shadow:0 6px 10px #000b,0 0 0 1px #0003;transition:transform .25s,box-shadow .25s,filter .25s}
 #deskPaper .np::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:2px;background:#0003}
 #deskPaper .mh{position:absolute;left:8%;right:8%;top:8%;height:12%;background:#2b2620}
 #deskPaper .cols{position:absolute;left:8%;right:8%;top:27%;bottom:9%;background:repeating-linear-gradient(#5a5248 0 2px,transparent 2px 7px);opacity:.5}
 #deskPaper:hover .np,#deskPaper:focus-visible .np{transform:rotate(-7deg) skewX(-26deg) scaleY(.62) translateY(-10%);box-shadow:0 14px 18px #000b,0 0 14px var(--hi);filter:brightness(1.08)}
 #deskPaper .new{position:absolute;top:38%;right:-6%;font-size:11px;line-height:1.5;padding:0 7px;border-radius:9px;background:#c0392b;color:#fff;font-weight:700;white-space:nowrap;box-shadow:0 0 8px #c0392b88}
 body.boot #deskPaper{visibility:hidden}
 @media (prefers-reduced-motion:reduce){#deskPaper .np{transition:none}}
 .readall{margin-left:auto;margin-right:10px;font-size:12px;padding:4px 10px;background:none;border:1px solid var(--line2);color:var(--text);border-radius:4px;cursor:pointer} .readall:disabled{opacity:.4;cursor:default}
 #busy{display:none} body.docked #desktop,body.docked .app{visibility:hidden}
 #date{font-family:"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums;color:var(--hi);text-shadow:0 0 8px var(--glow)}
 #state{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:13px;white-space:nowrap}
 #state i{width:8px;height:8px;border-radius:50%;background:var(--hi);box-shadow:0 0 8px var(--hi)}
 body.crisis #state{color:#ffb3a8}

 #body{flex:1;min-height:0;position:relative}
 .view{position:absolute;inset:0;display:none}
 .view.on{display:flex}

 /* 바탕화면 */
 #desktop{gap:0}
 #icons{flex:1;min-width:0;padding:18px 22px;overflow:auto}
 .grp{margin:0 0 18px}
 .grp h2{margin:0 0 10px;font-size:13px;font-weight:400;color:var(--dim)}
 .row{display:flex;flex-wrap:wrap;gap:6px 10px}
 .ic{position:relative;width:104px;padding:12px 6px 8px;background:none;border:1px solid transparent;border-radius:6px;text-align:center;color:var(--text)}
 .ic svg{width:44px;height:44px;display:block;margin:0 auto 7px;stroke:var(--hi);filter:drop-shadow(0 0 6px var(--glow))}
 .ic span{display:block;font-size:13px;line-height:1.35}
 body[data-gestalt=machine] .ic[data-open=press],body[data-gestalt=hive] .ic[data-open=press],body[data-gestalt=gestalt] .ic[data-open=press],body[data-gestalt=machine] #petCall,body[data-gestalt=hive] #petCall,body[data-gestalt=gestalt] #petCall{display:none!important} /* 단일 의식: 자유 언론·시민 청원 없음 */
 .ic:hover{border-color:var(--line);background:color-mix(in srgb,var(--hi) 8%,transparent)}
 .ic .n{position:absolute;top:6px;right:22px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:#1a1206;font-size:11px;font-weight:700;line-height:18px;display:none}
 .ic .n.show{display:block}
 #feed{flex:none;width:300px;border-left:1px solid var(--line2);padding:18px 18px;overflow:auto}
 #feed h2{margin:0 0 10px;font-size:13px;font-weight:400;color:var(--dim)}
 #feed ol{list-style:none;margin:0;padding:0}
 #feed li{padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px;line-height:1.5}
 #feed li b{display:block;font-weight:400;color:var(--hi);font-size:12px;font-variant-numeric:tabular-nums}
 .empty{color:var(--dim);font-size:13px;line-height:1.7}

 /* 집무실 안 앱(연락처·서신함·추모관) */
 .app{flex-direction:column}
 .apph{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line2)}
 .apph h3{margin:0;font-size:16px;font-weight:700;color:var(--hi)}
 .back{background:none;border:1px solid var(--line);border-radius:4px;padding:3px 12px;color:var(--text);font-size:13px} .back:hover{background:color-mix(in srgb,var(--hi) 10%,transparent)}
 .appb{flex:1;min-height:0;display:flex}
 #tabs{display:flex;gap:4px;padding:10px 18px 0}
 .tab{background:none;border:none;border-bottom:2px solid transparent;padding:4px 10px;color:var(--dim);font-size:13px}
 .tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--hi)}
 #roster{flex:1;min-width:0;overflow:auto;padding:8px 10px 14px 18px}
 .pp{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:8px 10px;background:none;border:1px solid transparent;border-radius:5px;text-align:left;color:var(--text)}
 .pp:hover{background:color-mix(in srgb,var(--hi) 7%,transparent)} .pp[aria-current=true]{border-color:var(--line);background:color-mix(in srgb,var(--hi) 11%,transparent)}
 .mono{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--hi);font-size:17px;font-weight:700;text-shadow:0 0 8px var(--glow);background:radial-gradient(circle,color-mix(in srgb,var(--hi) 14%,transparent),transparent 70%)}
 .mono.ico{font-size:0} .mono.ico i{display:block;width:72%;height:72%;background:var(--hi);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;filter:drop-shadow(0 0 4px var(--glow))} /* 게임 직업 아이콘을 테마 색으로 */
 .pp .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .pp .rl{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .pp .tag{font-size:12px;color:var(--gold)}
 #detail{flex:none;width:340px;border-left:1px solid var(--line2);padding:20px;overflow:auto}
 #detail .mono{width:84px;height:84px;font-size:34px;margin:4px 0 14px}
 #detail h4{margin:0;font-size:20px} #detail .rl{color:var(--dim);margin:2px 0 14px}
 #detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 16px;font-size:13px} #detail dt{color:var(--dim)} #detail dd{margin:0}
 .act{display:block;width:100%;margin:0 0 8px;padding:8px 12px;border-radius:4px;border:1px solid var(--hi);background:color-mix(in srgb,var(--hi) 16%,transparent);color:var(--text);font-weight:700}
 .act:hover{background:color-mix(in srgb,var(--hi) 28%,transparent)}
 .note{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2);color:var(--dim);font-size:12.5px;line-height:1.7}
 .msg{padding:26px 22px;max-width:560px}
 /* 인물과 1:1 통신(2026-10-18): 왼쪽 대화, 오른쪽 말투·기억 */
 .apph .who{display:flex;align-items:center;gap:10px;min-width:0} .apph .who .mono{width:34px;height:34px;font-size:14px}
 .apph .who b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .apph .who small{color:var(--dim);font-size:12px}
 .trust{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);white-space:nowrap}
 .trust .bar{position:relative;width:110px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--hi) 14%,transparent);overflow:hidden}
 .trust .bar i{position:absolute;top:0;bottom:0;left:50%;background:var(--hi);box-shadow:0 0 6px var(--glow)} .trust .bar i.neg{background:var(--bad)}
 .trust b{color:var(--text);font-weight:700} .trust .d{font-weight:700;opacity:0;transition:opacity .3s} .trust .d.show{opacity:1} .trust .d.up{color:#6fd6a8} .trust .d.down{color:var(--bad)}
 #tbody{flex:1;min-height:0;display:flex}
 #tcol{flex:1;min-width:0;display:flex;flex-direction:column}
 #tlog{flex:1;min-height:0;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
 .ln{max-width:78%;padding:8px 12px;border-radius:8px;line-height:1.55;font-size:13.5px;white-space:pre-wrap}
 .ln.them{align-self:flex-start;background:color-mix(in srgb,var(--hi) 10%,transparent);border:1px solid var(--line2)}
 .ln.me{align-self:flex-end;background:color-mix(in srgb,var(--gold) 14%,transparent);border:1px solid color-mix(in srgb,var(--gold) 30%,transparent)}
 .ln.sys{align-self:center;max-width:90%;color:var(--dim);font-size:12.5px;background:none;padding:2px 8px;text-align:center}
 .ln.wait{color:var(--dim);font-style:italic}
 #tin{display:flex;gap:8px;padding:10px 18px 14px;border-top:1px solid var(--line2)}
 #tin textarea{flex:1;resize:none;height:44px;padding:8px 10px;border-radius:5px;border:1px solid var(--line);background:color-mix(in srgb,var(--hi) 5%,#0006);color:var(--text);font:inherit;font-size:13.5px}
 #tin textarea:focus{outline:none;border-color:var(--hi)}
 #tin button,.apph .end{border:1px solid var(--hi);background:color-mix(in srgb,var(--hi) 16%,transparent);color:var(--text);border-radius:4px;padding:0 14px;font-weight:700}
 .apph .end{padding:4px 12px;font-size:13px}
 #tin button:disabled,.apph .end:disabled{opacity:.45;cursor:default}
 #tside{flex:none;width:300px;border-left:1px solid var(--line2);padding:14px 16px;overflow:auto;font-size:13px}
 #tside h4{margin:0 0 6px;font-size:12.5px;font-weight:400;color:var(--dim)}
 #tside .persona .traits{display:inline-block;margin-top:6px;font-size:11px;opacity:.75}
 #tside .persona{margin:0 0 16px;line-height:1.6}
 #tside ol{list-style:none;margin:0;padding:0} #tside li{padding:6px 0;border-bottom:1px solid var(--line2);line-height:1.5} #tside li b{display:block;font-weight:400;color:var(--hi);font-size:11.5px}
 #detail .trust{margin:0 0 14px}

 #mtabs{display:flex;gap:4px;margin-left:16px} #mtabs .tab{padding:4px 10px}
 #mlist{flex:1;min-width:0;overflow:auto;padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-content:start}
 #mlist.rows{display:block}
 .stone{position:relative;padding:18px 10px 14px;border:1px solid var(--line);border-radius:60px 60px 6px 6px;background:linear-gradient(180deg,color-mix(in srgb,var(--hi) 12%,transparent),color-mix(in srgb,var(--hi) 3%,transparent));color:var(--text);text-align:center}
 .stone:hover{background:linear-gradient(180deg,color-mix(in srgb,var(--hi) 20%,transparent),color-mix(in srgb,var(--hi) 5%,transparent))} .stone[aria-current=true]{border-color:var(--hi);box-shadow:0 0 14px var(--glow)}
 .stone.new::after{content:"";position:absolute;top:10px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold)}
 .stone .mono{margin:0 auto 8px} .stone b{display:block;font-size:14px;line-height:1.35} .stone small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px} .stone .why{color:var(--gold);font-size:11.5px}
 .gone{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line2)} .gone .nm{font-weight:700} .gone small{color:var(--dim);font-size:12px} .gone .why{font-size:12px;color:var(--dim)}
 #mdetail{flex:none;width:360px;border-left:1px solid var(--line2);padding:22px;overflow:auto} #mdetail h4{margin:6px 0 2px;font-size:20px;text-align:center} #mdetail .rl{color:var(--dim);text-align:center;font-size:12.5px} #mdetail>.mono{width:84px;height:84px;font-size:34px;margin:0 auto}
 .epi{margin:16px 0;padding:14px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;font-style:italic;line-height:1.7;color:var(--hi);text-shadow:0 0 8px var(--glow)}
 .epi .ed{display:block;margin:8px auto 0;font-style:normal;font-size:12px} .epi input{width:100%;box-sizing:border-box;padding:6px 8px;border-radius:4px;border:1px solid var(--line);background:#0006;color:var(--text);font:inherit;font-size:13px}
 #mdetail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 14px;font-size:13px} #mdetail dt{color:var(--dim)} #mdetail dd{margin:0}
 #mdetail ol{list-style:none;margin:0;padding:0;font-size:12.5px} #mdetail li{padding:5px 0;border-bottom:1px solid var(--line2);line-height:1.5} #mdetail h5{margin:14px 0 4px;font-size:12.5px;font-weight:400;color:var(--dim)}
 .env.final b::before{content:"✦ ";color:var(--gold)}
 /* 개인 서신(2026-10-18): 왼쪽 봉투 목록, 오른쪽 편지 */
 .freq{margin-left:auto;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
 .freq select{background:color-mix(in srgb,var(--hi) 6%,#0008);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:2px 6px;font:inherit;font-size:12.5px}
 #llist{flex:none;width:340px;border-right:1px solid var(--line2);overflow:auto;padding:8px 10px}
 .env{display:grid;grid-template-columns:10px minmax(0,1fr);gap:8px;width:100%;padding:9px 10px;margin:0 0 4px;background:none;border:1px solid transparent;border-radius:5px;text-align:left;color:var(--dim)}
 .env:hover{background:color-mix(in srgb,var(--hi) 7%,transparent)} .env[aria-current=true]{border-color:var(--line);background:color-mix(in srgb,var(--hi) 11%,transparent)}
 .env .dot{width:8px;height:8px;margin-top:6px;border-radius:50%} .env.new{color:var(--text)} .env.new .dot{background:var(--gold);box-shadow:0 0 6px var(--gold)}
 .env b{display:block;font-weight:700;font-size:13.5px;line-height:1.45} .env small{font-size:12px} .env .fav{color:var(--gold)}
 #lread{flex:1;min-width:0;overflow:auto;padding:22px 30px}
 #lread .lh{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line2)} #lread .lh .mono{width:46px;height:46px} #lread .lh b{display:block;font-size:16px} #lread .lh small{color:var(--dim)}
 #lread .paper{white-space:pre-wrap;line-height:1.85;font-size:14.5px;max-width:640px}
 .favbox{margin:20px 0 0;max-width:640px;padding:12px 14px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:6px;background:color-mix(in srgb,var(--gold) 7%,transparent);font-size:13px;line-height:1.6}
 .favbox h5{margin:0 0 4px;font-size:13px;color:var(--gold)} .favbox .row2{display:flex;gap:8px;margin-top:10px} .favbox .act{width:auto;margin:0;padding:6px 14px}
 .favbox .no{border-color:var(--line);background:none;font-weight:400}
 .rbox{margin:20px 0 0;max-width:640px} .rbox textarea{width:100%;height:70px;resize:vertical;padding:8px 10px;border-radius:5px;border:1px solid var(--line);background:color-mix(in srgb,var(--hi) 5%,#0006);color:var(--text);font:inherit;font-size:13.5px;box-sizing:border-box}
 .rbox .act{width:auto;margin-top:8px;padding:6px 16px} .rbox .ln{max-width:100%;margin-top:8px}
 .msg p{margin:0 0 10px}

 /* 켜질 때 한 번: 투사기 빛이 퍼지고 화면이 위에서 아래로 그려진다 */
 body.boot #beam{animation:beam .7s ease-out both}
 body.boot #holo{animation:draw .9s .25s cubic-bezier(.2,.7,.2,1) both}
 @keyframes beam{from{opacity:0;clip-path:polygon(49.6% 100%,50.4% 100%,50.4% 100%,49.6% 100%)}to{opacity:.35}}
 @keyframes draw{from{clip-path:inset(0 0 100% 0);filter:brightness(2.2)}to{clip-path:inset(0 0 0 0);filter:none}}
 @media (prefers-reduced-motion:reduce){body.boot #beam,body.boot #holo{animation:none}}
 @media (max-width:1000px){#feed{display:none}#detail{width:280px}}

<script>
 const $ = (id) => document.getElementById(id);
 // 언어 팩 호환: 화면 문구는 모두 한국어 원문을 열쇠로 번역표(SLLMCatalog)를 거친다(정적 문구는 i18n-ui 가 자동, 만든 문구는 T)
 const T = (s) => (window.SLLMI18n ? window.SLLMI18n.t(s) : s);
 const ROLE = { ruler: '통치자', governor: '총독', admiral: '제독', general: '장군', scientist: '과학자', commander: '지휘관', official: '관료' };
 let st = null, role = 'all', pick = '';
 setTimeout(() => document.body.classList.remove('boot'), 1400);

 function show(id) { for (const v of document.querySelectorAll('.view')) v.classList.toggle('on', v.id === id); if (id === 'contacts') drawContacts(); if (id === 'letters') loadLetters(); if (id === 'memorial') loadMemorial(); const f = document.querySelector('#' + id + ' .back, #' + id + ' .ic'); if (f) f.focus(); }
 document.querySelectorAll('.back').forEach((b) => (b.onclick = () => show('desktop')));
 // (통신 화면의 돌아가기는 아래 talk 부분에서 따로 정한다)
 document.querySelectorAll('[data-app]').forEach((b) => (b.onclick = () => show(b.dataset.app)));
 document.querySelectorAll('[data-open]').forEach((b) => (b.onclick = () => window.sllm.officeOpen(b.dataset.open)));
 $('x').onclick = () => window.sllm.officeClose();
 document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (document.body.classList.contains('docked')) { window.sllm.officeBack(); return; } if ($('talk').classList.contains('on')) { endTalk(); return; } if (!$('desktop').classList.contains('on')) show('desktop'); else window.sllm.officeClose(); });
 document.querySelectorAll('.tab').forEach((t) => (t.onclick = () => { role = t.dataset.role; document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', String(x === t))); drawContacts(); }));

 const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
 const initial = (n) => (String(n || '?').trim()[0] || '?').toUpperCase();
 // 인물 표식: 게임 직업 아이콘이 있으면 테마 색으로 칠한 아이콘, 없으면(통치자·게임 폴더 모름) 이름 첫 글자
 const badge = (p) => { const key = p.role === 'scientist' && !p.fleet ? 'scholar' : p.role, url = st && st.icons && st.icons[key]; const m = mk('div', 'mono' + (url ? ' ico' : ''), url ? undefined : initial(p.name)); if (url) { const i = document.createElement('i'); i.style.setProperty('--m', 'url("' + url + '")'); m.append(i); m.title = T(ROLE[p.role] || ''); } return m; };
 const isCmd = (p) => p.role === 'admiral' || p.role === 'general' || p.role === 'commander';

 function draw(s) {
  st = s;
  document.body.dataset.gestalt = s.gestalt || ''; // 단일 의식 제국: 언론사 인터뷰·시민 청원 숨김(2026-10-19)
  $('emp').textContent = s.empire || T('우리 제국');
  $('date').textContent = s.date || '';
  const cr = s.crisis && s.crisis.active;
  document.body.classList.toggle('crisis', !!cr);
  $('stateTxt').textContent = cr ? T('은하 위기') + ': ' + (window.SLLMI18n && window.SLLMI18n.language() === 'en' /* i18n-data: 위기 이름 자료는 한/영 두 가지 */ ? s.crisis.namesEn : s.crisis.names) : (s.running ? T('평시') : T('게임 대기 중'));
  const nm2 = s.memorial || 0; $('nMemorial').textContent = nm2 > 9 ? '9+' : String(nm2); $('nMemorial').classList.toggle('show', nm2 > 0);
  { const np = $('nPaperDesk'); if (np) { np.hidden = !s.paperNew; np.textContent = T('새 호'); } }
  const n = s.letters || 0; $('nLetters').textContent = n > 9 ? '9+' : String(n); $('nLetters').classList.toggle('show', n > 0);
  { const m = s.inbox || 0, e = $('nTerminal'); if (e) { e.textContent = m > 9 ? '9+' : String(m); e.classList.toggle('show', m > 0); } } // 외교 단말기의 안 읽은 외교 서신
  const fl = $('feedList'); fl.textContent = '';
  for (const f of s.feed || []) { const li = mk('li'); li.append(mk('b', '', f.date), document.createTextNode(T(f.text))); fl.append(li); }
  $('feedEmpty').hidden = (s.feed || []).length > 0;
  if ($('contacts').classList.contains('on')) drawContacts();
  if ($('memorial').classList.contains('on') && mst && mst.unseen !== (s.memorial || 0)) loadMemorial();
  if ($('letters').classList.contains('on') && !lbusy && (!lst || lst.unread !== (s.letters || 0))) loadLetters(); // 새 편지가 왔거나 다른 곳에서 읽음
 }

 function drawContacts() {
  if (!st) return;
  const box = $('roster'); box.textContent = '';
  const list = (st.people || []).filter((p) => role === 'all' || p.role === role);
  if (!st.planetsLoaded && (role === 'all' || role === 'governor')) { // 총독이 어느 행성을 맡았는지는 행성 목록에서 알 수 있다
   const w = mk('div', 'empty'); w.style.padding = '8px 10px 12px';
   w.append(mk('div', '', T('총독 명단은 게임에서 행성 목록을 받아 와야 보입니다.')));
   const b = mk('button', 'back', T('총독 명단 불러오기')); b.style.marginTop = '8px'; b.onclick = async () => { b.disabled = true; b.textContent = T('불러오는 중…'); const r = await window.sllm.officePlanets().catch((e) => ({ ok: false, error: e.message })); if (!r.ok) { b.disabled = false; b.textContent = T('총독 명단 불러오기'); w.append(mk('div', '', r.error || '')); } };
   w.append(b); box.append(w);
  }
  if (!st.rosterLoaded) { const w = mk('div', 'empty', T('제국의 지도자 명단은 게임에서 한 달이 지나면 들어옵니다. 그 전에는 총독과 함대 사령부가 아는 인물만 보입니다.')); w.style.padding = '4px 10px 10px'; box.append(w); }
  if (!list.length) { box.append(mk('div', 'empty', T('이 분류에는 아직 인물이 없습니다.'))); }
  for (const p of list) {
   const b = mk('button', 'pp'); b.type = 'button'; b.setAttribute('aria-current', String(p.key === pick));
   const mid = mk('div'); mid.append(mk('div', 'nm', p.name), mk('div', 'rl', T(ROLE[p.role]) + (p.place ? ' · ' + p.place : isCmd(p) && st.rosterLoaded ? ' · ' + T('함대 없음') : '')));
   b.append(badge(p), mid, mk('div', 'tag', p.capital ? T('수도') : p.status === 'acclaimed' ? T('추앙') : p.status === 'reprimanded' ? T('질책') : p.council ? T('평의회') : p.lv ? 'Lv ' + p.lv : ''));
   b.onclick = () => { pick = p.key; drawContacts(); };
   box.append(b);
  }
  drawDetail(list.find((p) => p.key === pick) || null);
 }

 function drawDetail(p) {
  const d = $('detail'); d.textContent = '';
  if (!p) { d.append(mk('div', 'empty', T('왼쪽에서 인물을 고르면 자세한 정보와 할 수 있는 일이 보입니다.'))); return; }
  const nm = mk('h4', '', p.name); nm.setAttribute('data-i18n-skip', '');
  d.append(badge(p), nm, mk('div', 'rl', T(ROLE[p.role])));
  const dl = mk('dl');
  const row = (k, v, raw) => { if (!v && v !== 0) return; const dd = mk('dd', '', String(v)); if (raw) dd.setAttribute('data-i18n-skip', ''); dl.append(mk('dt', '', T(k)), dd); };
  if (p.lv) row('기술 수준', p.lv);
  if (p.council) row('직책', T('평의회 위원'));
  if (p.role === 'governor') { row('맡은 행성', p.planet, true); if (p.capital) row('비고', T('수도 행성')); }
  else if (isCmd(p)) { row('맡은 함대', p.fleet || (st.rosterLoaded ? T('없음 (대기 중)') : ''), !!p.fleet); if (p.battles !== undefined) { row('최근 전장', p.place && p.place !== p.fleet ? p.place : '', true); row('기억하는 전투', p.battles); row('청문회 평가', p.status === 'acclaimed' ? T('추앙') : p.status === 'reprimanded' ? T('질책') : T('없음')); } }
  else if (p.fleet) row('맡은 함대', p.fleet, true);
  if (p.traits && p.traits.length) row('특성', p.traits.join(' · '), true); // 이름은 게임 지역화(한국어/영어) 그대로
  d.append(dl);
  const tr = mk('div', 'trust'); d.append(tr);
  const memBox = mk('div', 'note'); memBox.setAttribute('data-i18n-skip', '');
  const a = mk('button', 'act');
  if (p.role === 'governor' && p.planet) { a.textContent = T('통신 열기'); a.onclick = () => window.sllm.officeOpen('gov', p.planet); } // 총독은 행성 정보가 있는 총독 창으로
  else { a.textContent = T('통신 열기'); a.onclick = () => openTalk(p); }
  d.append(a);
  { const b = mk('button', 'act'); b.textContent = T('📜 인물 전기'); b.style.background = 'none'; b.title = T('이 인물의 배경 이야기를 직접 적습니다. 대화·편지·보고에서 AI가 참고합니다.'); // 2026-10-18 모드 영웅 설정 등
