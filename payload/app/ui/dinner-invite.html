<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>지도자 초대하기</title><script src="theme.js"></script><script src="i18n-catalog.js"></script><script src="i18n-ui.js"></script><style>
:root{--bg:#081921;--panel:#102a34;--text:#dcebf0;--dim:#91b0ba;--hi:#81d4c1;--line:#36505b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 'Malgun Gothic',sans-serif}header{-webkit-app-region:drag;padding:12px 20px;display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0}header button{margin-left:auto;-webkit-app-region:no-drag}main{padding:20px}button,select,textarea{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:8px}button{cursor:pointer}button:disabled{opacity:.4}select,textarea{width:100%;margin:8px 0 14px}textarea{height:220px;resize:vertical}label{display:block;color:var(--hi)}.muted{font-size:12px;color:var(--dim)}#status{white-space:pre-wrap;color:var(--hi);margin:8px 0}#visits{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}.visit{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}footer{display:flex;gap:10px}</style><link rel="stylesheet" href="special-rooms.css"><link rel="stylesheet" href="scrollbar-dark.css"></head><body data-room="dinner-invite">
<header><h1>🍽️ 지도자 초대하기</h1><button id="close">닫기</button></header><main><label for="guest">초대할 제국</label><select id="guest"></select><label for="body">초대 서신</label><textarea id="body" maxlength="3000" placeholder="지도자에게 전할 초대의 말과 방문 목적을 적어 주세요."></textarea><p class="muted">답장은 게임 시간으로 3~6개월 뒤 도착합니다. 수락하면 답장 시점부터 6개월 뒤 방문합니다. 관계에 따라 거절할 수 있습니다.</p><p class="muted">지도자 도착 후 게임 이벤트에서 성대한 접대(1,000 에너지), 일반 접대(100 에너지), 굴욕적 접대(소모 없음)를 선택합니다.</p><footer><button id="send">초대 서신 보내기</button><button id="refresh">예약 새로고침</button></footer><div id="status" role="status"></div><div id="visits"></div></main>
<script>
const $=id=>document.getElementById(id),t=s=>window.SLLMI18n?.t(s)||s;let state=null,busy=false;
const labels={waiting_reply:'답장 대기',writing_reply:'답장 작성 대기',reply_ready:'답장 전달 대기',accepted:'방문 예정',declined:'초대 거절',arrival_requested:'도착 이벤트 확인 중',arrived:'도착 · 게임에서 접대 선택',prepared:'접대 선택 완료',cancelled:'방문 취소'};
async function refresh(){const r=await window.sllm.dinnerState();if(!r.ok){$('status').textContent=r.error;return;}state=r;const selected=$('guest').value;$('guest').replaceChildren(...r.contacts.map(c=>new Option(c.name,String(c.idx))));if(selected)$('guest').value=selected;$('send').disabled=busy||!r.sid||!r.contacts.length;$('visits').replaceChildren(...r.visits.map(v=>{const d=document.createElement('div');d.className='visit';const title=document.createElement('b');title.textContent=v.name+' · '+t(labels[v.phase]);const p=document.createElement('div');p.textContent=t('발송')+': '+v.sent+' · '+t('답장 예정')+': '+v.due+(v.arrival?' · '+t('방문 예정일')+': '+v.arrival:'');d.append(title,p);const body=document.createElement('details'),summary=document.createElement('summary'),text=document.createElement('div');summary.textContent=t('보낸 초대장');text.textContent=v.body;text.style.whiteSpace='pre-wrap';text.dataset.i18nSkip='';body.append(summary,text);d.append(body);if(v.phase==='prepared'){const open=document.createElement('button');open.textContent=t('만찬장 열기');open.onclick=async()=>{const r=await window.sllm.dinnerBanquet(v.id);if(!r.ok)$('status').textContent=r.error;};d.append(open);}if(v.error){const err=document.createElement('div');err.textContent=v.error;d.append(err);}return d;}));}
$('send').onclick=async()=>{if(busy||!state)return;const idx=Number($('guest').value),body=$('body').value.trim();if(!body){$('status').textContent='초대 서신을 입력해 주세요.';return;}busy=true;$('send').disabled=true;try{const r=await window.sllm.dinnerInvite({sid:state.sid,branch:state.branch,idx,body});$('status').textContent=r.ok?'초대 서신을 보냈습니다. 게임 시간으로 답장을 기다려 주세요.':r.error;if(r.ok)$('body').value='';}catch(e){$('status').textContent=e.message;}finally{busy=false;await refresh();}};$('refresh').onclick=refresh;$('close').onclick=()=>window.sllm.dinnerClose();window.sllm.launcherState().then(s=>applyTheme(s.theme,s.custom));refresh();
</script></body></html>
