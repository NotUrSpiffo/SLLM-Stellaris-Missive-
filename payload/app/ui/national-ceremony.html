<!doctype html><html><head><meta charset="utf-8"><title>National Ceremony</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050e16;color:#e7f1ed;font:16px/1.8 "Malgun Gothic","Segoe UI",sans-serif}body{border:1px solid #738e91}#scene{position:absolute;inset:0;background:center/cover no-repeat}#shade{position:absolute;inset:0;background:linear-gradient(90deg,#04121900 15%,#04121955 45%,#041219ee 100%)}header{position:absolute;left:4%;right:4%;top:4%;display:flex;align-items:center;gap:20px;z-index:3}#flag{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 2px 10px #000)}h1{font-size:clamp(25px,3vw,42px);letter-spacing:.12em;color:#f5df9d;margin:0;text-shadow:0 2px 12px #000}button{background:#102d35;color:#e9f4ef;border:1px solid #688e91;padding:10px 20px;cursor:pointer;font:inherit}button:hover{background:#24515b}button:disabled{opacity:.4;cursor:default}#close{margin-left:auto}#story{position:absolute;right:4%;top:18%;bottom:14%;width:48%;padding:25px 30px;background:linear-gradient(135deg,#071c23ed,#07151bf2);border:1px solid #89aa9d66;border-top:2px solid #c4b77a;box-shadow:0 12px 40px #0005;overflow:auto;scrollbar-width:thin;scrollbar-color:#4e7b7d #0b2028;white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(16px,1.6vw,22px);line-height:1.95}footer{position:absolute;bottom:4%;right:4%;width:48%;display:flex;align-items:center;justify-content:space-between;gap:12px}#status{color:#afc6c9;font-size:12px}#credits{position:absolute;inset:18% 15% 10%;overflow:hidden;display:none;mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}#roll{position:absolute;top:100%;width:100%;text-align:center;white-space:pre-wrap;font-size:clamp(21px,2.4vw,34px);line-height:2.1;text-shadow:0 2px 10px #000}body.founding #story{display:none}body.founding #credits{display:block}body.founding #shade{background:linear-gradient(90deg,#02080e33,#061a24b3 35%,#061a24b3 65%,#02080e33)}body.founding footer{width:auto;left:15%;right:15%}body.founding.salute #credits{display:flex;align-items:center;mask-image:none}.salute #roll{position:static}#error{position:absolute;bottom:3%;left:4%;color:#ffc9b7;max-width:40%}
</style><script src="i18n-catalog.js"></script><script src="i18n-ui.js"></script></head><body><div id="scene"></div><div id="shade"></div><header><img id="flag" alt=""><h1 id="title"></h1><button id="close"></button></header><article id="story"></article><div id="credits"><div id="roll"></div></div><footer><span id="status"></span><button id="prev"></button><button id="next"></button></footer><div id="error"></div><script>
(()=>{const L=(k,e)=>window.SLLMI18n?.pick?window.SLLMI18n.pick(k,e):k,$=id=>document.getElementById(id);let data,audio,done=false,page=0,pages=[],timer,raf;
function stop(){if(audio)audio.pause();clearTimeout(timer);cancelAnimationFrame(raf)}
function finish(early){if(done)return;done=true;stop();window.sllm.ceremonyDone(early)}
function show(){const box=$('story');box.textContent=pages[page];box.scrollTop=0;$('prev').disabled=page===0;$('next').textContent=page===pages.length-1?L('행사 마치기','Complete ceremony'):L('다음','Next');$('status').textContent=L(`${page+1} / ${pages.length} · 내레이션`,`${page+1} / ${pages.length} · Narration`);$('next').disabled=box.scrollHeight>box.clientHeight+8;}
$('story').onscroll=()=>{const b=$('story');if(b.scrollTop+b.clientHeight>=b.scrollHeight-8)$('next').disabled=false};
$('next').onclick=()=>{if(data.kind==='founding'||page===pages.length-1)finish(false);else{page++;show()}};$('prev').onclick=()=>{if(page>0){page--;show()}};$('close').textContent=L('닫기','Close');$('prev').textContent=L('이전','Previous');$('close').onclick=()=>finish(true);addEventListener('keydown',e=>{if(e.key==='Escape')finish(true)});addEventListener('pagehide',()=>{done=true;stop()});
document.addEventListener('DOMContentLoaded',async()=>{try{data=await window.sllm.ceremonyData();if(!data?.lines?.length)throw Error(L('행사 자료가 없습니다.','No ceremony data.'));if(done)return;
$('title').textContent=data.title;if(data.flag)$('flag').src=data.flag;else $('flag').hidden=true;const bg=data.backdrop||data.images?.speech||data.images?.march;if(bg)$('scene').style.backgroundImage='url('+JSON.stringify(bg)+')';
if(data.audio){audio=new Audio(data.audio);audio.volume=Math.max(0,Math.min(1,data.volume??.7));audio.play().catch(()=>{});}
if(data.kind==='founding'){document.body.classList.add('founding');$('prev').hidden=true;$('next').disabled=true;$('next').textContent=L('행사 마치기','Complete ceremony');$('roll').textContent=data.lines.join('\n\n');$('status').textContent=L('연설문이 끝나면 행사를 마칠 수 있습니다.','Complete the ceremony after the address ends.');
if(data.salute){document.body.classList.add('salute');timer=setTimeout(()=>{$('next').disabled=false},10000);}else{const el=$('roll'),height=$('credits').clientHeight,total=height+el.scrollHeight;const duration=Math.max(18000,total/26*1000),start=performance.now();const step=()=>{if(done)return;const p=Math.min(1,(performance.now()-start)/duration);el.style.transform=`translateY(${-total*p}px)`;if(p===1){$('next').disabled=false;$('status').textContent=L('기념 연설을 마쳤습니다.','The anniversary address has concluded.');}else raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step);}}
else{let current='';for(const line of data.lines){if(current&&current.length+line.length>900){pages.push(current);current='';}current+=(current?'\n\n':'')+line;}if(current)pages.push(current);show();}
}catch(e){$('error').textContent=String(e.message||e);$('next').hidden=true;$('prev').hidden=true;}});
})();</script></body></html>
