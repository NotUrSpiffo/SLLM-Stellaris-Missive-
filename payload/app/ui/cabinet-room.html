<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Cabinet Chamber</title>
<!--
 내각 회의실(2026-10-19 사용자 결정). 집무실의 연장: 집무실 창과 같은 자리·크기로 열리고, 배경이 화면 전체를 차지하는 1인칭 회의실.
 - 정중앙 스크린: 장관들이 발의한 안건 목록 → 고르면 논의 중인 안건이 크게 올라온다.
 - 양옆 자리: 장관 수에 맞춰 왼쪽·오른쪽에 번갈아 앉는다(가까울수록 크게).
   직접 참석(다른 임무 없음) = 실물 초상화. 임무 중(함대·과학선·총독) = 홀로그램으로 원격 참석.
 - 아래: 발언 입력·회의 기록·찬반 집계·안건 채택·「집무실로 돌아가기」.
 틀(배치·자리 계산·데이터 연결)만 여기서 정한다. 그림·세부 꾸밈은 GPT 담당:
   배경 ui/assets/rooms/cabinet-room-v1.png(없으면 CSS 초안), 꾸밈은 ui/cabinet-room-art.css(없어도 됨).
 앱 쪽은 예전 회의와 같다(src/features/faction-app.ts: facState·facPick·facSay·facApply·facClose). 문구는 ui(한, 영)만(언어 팩 호환).
-->
<style>
 :root{--bg:#04080c;--text:#e3edf0;--dim:#8aa4ac;--hi:#5fd4e4;--gold:#d9b45a;--yes:#52b4e6;--no:#ee6a58;--abs:#8aa0a8;
  --d-defense:#d0604e;--d-research:#7fd0e8;--d-state:#b48ae8;--d-economy:#e8c872;--d-interior:#6fd7a8;--holo:#6fe3f0;
  --mono:"D2Coding","Cascadia Mono",Consolas,"Malgun Gothic",monospace}
 *{box-sizing:border-box}
 html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 "Malgun Gothic","Segoe UI",sans-serif;overflow:hidden;user-select:none}
 button,input{font:inherit;color:inherit}
 /* 방: 배경이 창 전체 */
 #room{position:fixed;inset:0;overflow:hidden;-webkit-app-region:drag}
 #bg{position:absolute;inset:0;background:
   radial-gradient(ellipse 30% 22% at 50% 24%,#5fd4e41c,transparent 70%),
   radial-gradient(ellipse 80% 40% at 50% 0%,#d9b45a14,transparent 70%),
   linear-gradient(180deg,#0e151b 0%,#0a1015 38%,#07090c 62%,#040507 100%)}
 #bg.img{background-size:cover;background-position:center}
 /* 초안: 바닥·벽 기둥·긴 탁자(원근) — 그림이 있으면 숨긴다 */
 #draft{position:absolute;inset:0;pointer-events:none}
 #bg.img + #draft{display:none}
 #draft .pillar{position:absolute;top:0;bottom:38%;width:5%;background:linear-gradient(90deg,#0d1419,#1a242c 50%,#0d1419);box-shadow:0 0 30px #000}
 #draft .floor{position:absolute;left:0;right:0;bottom:0;height:46%;background:repeating-linear-gradient(90deg,transparent 0 6.2%,#ffffff07 6.2% 6.4%),linear-gradient(#0b0f13,#040506)}
 #table{position:absolute;left:50%;bottom:-4%;width:64%;height:64%;transform:translateX(-50%);clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);
   background:linear-gradient(180deg,#2b2016 0%,#3a2b1c 45%,#24190f 100%);box-shadow:inset 0 0 0 1px #6b5332}
 #table::after{content:"";position:absolute;inset:0;clip-path:polygon(47% 0,53% 0,70% 100%,30% 100%);background:linear-gradient(180deg,#d9b45a10,#d9b45a1c)}
 /* 정중앙 스크린 */
 #screen{position:absolute;left:50%;top:4%;width:min(46%,760px);height:31%;transform:translateX(-50%);-webkit-app-region:no-drag;
   border:1px solid #5fd4e466;background:linear-gradient(180deg,#071a22ee,#04121aee);box-shadow:0 0 40px #5fd4e425,inset 0 0 30px #5fd4e412;display:flex;flex-direction:column;padding:12px 16px;gap:8px;overflow:hidden}
 #screen::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 3px)}
 #screen .over{font:600 10px var(--mono);letter-spacing:.24em;color:var(--hi);display:flex;justify-content:space-between}
 #plist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
 .prop{border:1px solid #5fd4e433;border-left:4px solid var(--ec,#5fd4e4);background:#0a222c;padding:7px 10px;cursor:pointer;text-align:left}
 .prop:hover{border-color:#5fd4e488} .prop .an{font-weight:700;font-size:14px} .prop .by{color:var(--dim);font-size:11.5px}
 .prop .rw,.cur .rw{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px} .rw span{font-size:11px;padding:1px 7px;border:1px solid #d9b45a88;color:var(--gold)}
 .unv{font:10px var(--mono);color:var(--dim);border:1px dashed #5fd4e444;padding:0 5px;margin-left:6px}
 .cur{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
 .cur .an{font-size:clamp(17px,1.8vw,24px);font-weight:700;color:#f2f7f8;text-shadow:0 0 12px #5fd4e455}
 .cur .ad{color:#b9ccd1;font-size:13px} .cur .by{color:var(--dim);font-size:12px} .cur .by i{font-style:normal;color:var(--ec)}
 #stances{display:flex;gap:10px;font:600 12px var(--mono)} #stances .y{color:var(--yes)} #stances .n{color:var(--no)} #stances .a{color:var(--abs)}
 #other{align-self:flex-start;border:1px solid #5fd4e455;background:#5fd4e412;padding:2px 10px;font-size:11.5px;cursor:pointer}
 /* 자리 */
 #seats{position:absolute;inset:0;pointer-events:none}
 .seat{position:absolute;transform:translate(-50%,0) scale(var(--s,1));transform-origin:50% 0;display:flex;flex-direction:column;align-items:center;gap:4px;width:150px;pointer-events:auto;cursor:pointer;-webkit-app-region:no-drag;text-align:center}
 .seat .pt{position:relative;width:118px;height:140px;border-radius:6px 6px 2px 2px;overflow:hidden;display:grid;place-items:center;font-size:34px;font-weight:700;background:linear-gradient(#1c2a33,#0c1419);border:2px solid color-mix(in srgb,var(--ec) 70%,#000);box-shadow:0 10px 24px #000c}
 .seat .pt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
 .seat .plate{background:#120d08e6;border:1px solid #6b5332;padding:2px 8px;max-width:150px}
 .seat .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .seat .post{font:600 10px var(--mono);color:var(--ec);max-width:140px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
 .seat .v{font:600 10.5px var(--mono);padding:0 6px;border:1px solid;background:#000a} .v.yes{color:var(--yes)} .v.no{color:var(--no)} .v.abstain{color:var(--abs)} .seat .wait{font:10.5px var(--mono);color:var(--dim)}
 .seat .crown{position:absolute;top:4px;right:6px;color:var(--gold);text-shadow:0 0 4px #000;z-index:2}
 .seat.to .pt{outline:2px dashed var(--hi);outline-offset:3px}
 .seat.talk .pt{box-shadow:0 0 0 2px #fff4,0 0 26px 8px color-mix(in srgb,var(--ec) 60%,transparent)}
 /* 홀로그램(원격 참석): 청록 반투명·주사선·깜빡임 */
 .seat.holo .pt{background:linear-gradient(#0a3a44aa,#04202888);border-color:var(--holo);filter:saturate(.2) sepia(.3) hue-rotate(140deg) brightness(1.25);opacity:.82;animation:holo 3.2s ease-in-out infinite}
 .seat.holo .pt::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#6fe3f02a 0 1px,transparent 1px 3px);mix-blend-mode:screen}
 .seat.holo .pt img{mix-blend-mode:screen;opacity:.85}
 .seat.holo::before{content:"";position:absolute;bottom:-6px;left:50%;width:90px;height:12px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(#6fe3f0aa,transparent 70%)}
 .seat .remote{font:600 9.5px var(--mono);color:var(--holo);letter-spacing:.06em;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
 @keyframes holo{0%,100%{opacity:.8}47%{opacity:.85}50%{opacity:.55}53%{opacity:.86}}
 /* 말풍선 */
 .bubble{position:absolute;z-index:6;max-width:min(440px,40vw);padding:8px 12px;background:#f2ecd9;color:#1a1a1a;border-radius:10px;font-size:13px;line-height:1.5;box-shadow:0 6px 18px #000a;transform:translate(-50%,-100%);pointer-events:none;opacity:0;transition:opacity .2s}
 .bubble.on{opacity:1} .bubble b{display:block;font-size:11px;color:var(--bc);margin-bottom:2px}
 .bubble.me{left:50%!important;top:auto!important;bottom:calc(var(--hud) + 14px);transform:translateX(-50%);background:#f6e7bf}
 /* 아래 조작판 */
 #hud{--h:var(--hud);position:fixed;left:0;right:0;bottom:0;height:var(--hud);-webkit-app-region:no-drag;display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 16px;background:linear-gradient(0deg,#03060aee,#03060acc 70%,transparent);align-items:end}
 :root{--hud:138px}
 /* 탁자 위 기록판: 가운데 아래, 반투명 유리. 위쪽(오래된 줄)은 흐려진다 */
 #log{position:fixed;z-index:4;left:50%;bottom:calc(var(--hud) + 14px);width:min(42vw,700px);height:min(30vh,280px);transform:translateX(-50%);-webkit-app-region:no-drag;
   overflow-y:auto;padding:14px 18px 10px;font-size:13.5px;line-height:1.6;user-select:text;
   background:linear-gradient(180deg,#0a1a2433,#0a1a2499 35%,#0a1a24bb);border:1px solid #9fd6e233;border-radius:8px;backdrop-filter:blur(3px);
   box-shadow:0 10px 30px #0006,inset 0 1px 0 #ffffff14;
   -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22%);mask-image:linear-gradient(180deg,transparent 0,#000 22%)}
 #log .ln{text-shadow:0 1px 3px #000c} #log{display:flex;flex-direction:column} #log > .ln:first-child{margin-top:auto} /* 새 말은 아래쪽, 탁자 가장자리 쪽에 */
 .ln{margin:0 0 4px;white-space:pre-wrap} .ln .who{font-weight:700;margin-right:6px} .ln.me .who{color:var(--gold)} .ln.ai .who{color:var(--ec,var(--hi))} .ln.sys{color:var(--dim);font-size:11.5px}
 #mid{display:flex;flex-direction:column;gap:6px;min-width:0}
 #toRow{font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:center} #toRow b{color:var(--text)}
 #toAll{border:1px solid #5fd4e455;background:none;padding:0 8px;cursor:pointer}
 .prompt{display:flex;border:1px solid #5fd4e466;background:#04121acc} .prompt input{flex:1;border:0;background:none;padding:8px 10px;outline:none} .prompt button{border:0;border-left:1px solid #5fd4e466;background:#5fd4e41a;padding:0 16px;cursor:pointer}
 #status{font-size:12px;color:var(--gold);min-height:1.4em} #hint{font-size:11.5px;color:var(--dim)}
 #acts{display:flex;flex-direction:column;gap:6px;align-items:stretch;align-self:center}
 #acts button{border:1px solid #5fd4e466;background:#071820;padding:7px 14px;cursor:pointer;white-space:nowrap}
 #apply{border-color:var(--gold)!important;color:var(--gold)} #back{color:var(--dim)}
 button:disabled{opacity:.4;cursor:not-allowed} #acts button:hover:not(:disabled),.prompt button:hover:not(:disabled){filter:brightness(1.4)}
 /* 위쪽 띠 */
 #top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:8px 14px;-webkit-app-region:drag;pointer-events:none}
 #top > *{pointer-events:auto} #top .t{font:600 11px var(--mono);letter-spacing:.2em;color:var(--gold)} #top .sp{flex:1}
 #top button{-webkit-app-region:no-drag;border:1px solid #ffffff22;background:#000a;padding:3px 10px;cursor:pointer;color:var(--dim)}
 .tag{border:1px dashed var(--gold);color:var(--gold);font:10px var(--mono);padding:0 6px}
 #cancel{position:fixed;left:50%;top:42%;transform:translateX(-50%);z-index:7;padding:10px 16px;border:1px solid var(--no);background:#2a1010ee;color:#ffd2cb;display:none}
 #cancel.on{display:block}
 [hidden]{display:none!important}
 @media (max-height:700px){:root{--hud:130px} #screen{height:30%} #log{height:24vh}}
 @media (prefers-reduced-motion:reduce){.seat.holo .pt{animation:none}}
 /* 채택 결재(2026-10-19 사용자: 윈도 확인창이 「짜친다」 → 회의실 안 홀로그램 결재판) */
 #seal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#04121a99,#000c 75%);opacity:0;pointer-events:none;transition:opacity .22s}
 #seal.on{opacity:1;pointer-events:auto}
 #seal .card{position:relative;width:min(520px,86vw);padding:26px 30px 22px;color:var(--text);background:linear-gradient(170deg,#0b2430e6,#061219f0);border:1px solid #5fd4e466;box-shadow:0 0 40px #5fd4e433,inset 0 0 60px #5fd4e414;clip-path:polygon(18px 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%,0 18px);transform:translateY(12px) scale(.97);transition:transform .25s}
 #seal.on .card{transform:none}
 #seal .card::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,#5fd4e40a 3px 4px)}
 #seal .k{font:600 10px var(--mono);letter-spacing:.3em;color:var(--hi);display:flex;justify-content:space-between;border-bottom:1px solid #5fd4e433;padding-bottom:8px}
 #seal h3{margin:16px 0 4px;font-size:22px;letter-spacing:.02em;color:#fff;text-shadow:0 0 14px #5fd4e455}
 #seal .by{font-size:12px;color:var(--dim)}
 #seal .fx{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 6px}
 #seal .fx span{font-size:12.5px;padding:4px 10px;border:1px solid #d9b45a77;color:var(--gold);background:#d9b45a12}
 #seal .dur{font:11px var(--mono);color:var(--dim);letter-spacing:.06em}
 #seal .row{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
 #seal button{font:inherit;font-size:13px;padding:9px 18px;cursor:pointer;border:1px solid #5fd4e455;background:#0a1d26;color:var(--dim)}
 #seal button.go{border-color:var(--gold);color:#1a1408;background:linear-gradient(120deg,#e6c46a,#b68d36);font-weight:700;letter-spacing:.04em}
 #seal button:hover{filter:brightness(1.25)}
 #seal .stamp{position:absolute;right:30px;top:58px;font:900 13px var(--mono);letter-spacing:.2em;color:#d9b45a;border:2px solid #d9b45a;padding:4px 8px;transform:rotate(-8deg) scale(1.6);opacity:0}
 #seal.done .stamp{opacity:.9;transform:rotate(-8deg) scale(1);transition:all .18s cubic-bezier(.2,1.6,.4,1)}
</style>
<script src="theme.js"></script><script src="portrait-variants.js"></script><script src="i18n-catalog.js"></script><script src="i18n-ui.js"></script>

</head><body>
<div id="room">
 <div id="bg"></div>
 <div id="draft"><div class="floor"></div><div class="pillar" style="left:6%"></div><div class="pillar" style="left:22%"></div><div class="pillar" style="right:22%"></div><div class="pillar" style="right:6%"></div></div>
 <div id="table"></div>
 <section id="screen" aria-live="polite">
  <div class="over"><span id="scrT"></span><span id="scrDate" data-i18n-skip></span></div>
  <div id="plist"></div>
  <div class="cur" id="curBox" hidden></div>
 </section>
 <div id="seats"></div>
 <div class="bubble" id="bubble"></div>
</div>
<!-- 회의 기록: 탁자 위에 반투명하게 떠 있는 기록판(2026-10-19 사용자 요청: 아래 조작판에선 잘 안 보여서) -->
<div id="log" aria-live="polite"></div>
<div id="top"><span class="t" id="ttl"></span><span class="tag" id="tagDemo" hidden></span><span class="sp"></span><span id="empire" data-i18n-skip class="t"></span><button id="x" type="button"></button></div>
<div id="cancel" role="alert"></div>
<div id="hud">
 <div id="mid">
  <div id="toRow"><span id="toCap"></span><b id="toWho" data-i18n-skip></b><button id="toAll" type="button" hidden></button></div>
  <div class="prompt"><input id="q" autocomplete="off"><button id="send" type="button"></button></div>
  <div id="status" role="status"></div><div id="hint"></div>
 </div>
 <div id="acts"><button id="apply" type="button" disabled></button><button id="back" type="button"></button></div>

<script>
 const $ = (id) => document.getElementById(id);
 const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
 const ui = (ko, en) => window.SLLMI18n?.pick ? window.SLLMI18n.pick(ko, en) : ko;
 const VN = () => ({ yes: ui('찬성', 'Support'), no: ui('반대', 'Oppose'), abstain: ui('유보', 'Undecided') });
 const dc = (d) => `var(--d-${d})`;
 let S = null, to = null, busy = false, talking = null, POS = {}, IMG = { images: {}, defaults: {} }, showList = false;
 // 장관 얼굴: 통치자 종족 계열 초상화(변형) → 모드 기본 그림(예전 회의와 같은 규칙)
 const pic = (k, seed = '') => (k && SLLMVariant.pick(IMG.images, ['delegate:' + k, 'class:' + k], seed, IMG.defaults[k])) || null;
 const lock = () => !!(S && (S.busy || S.applied || S.uncertain || S.cancelled));

 // 배경 그림(있으면). 없으면 CSS 초안
 { const im = new Image(); im.onload = () => { $('bg').classList.add('img'); $('bg').style.backgroundImage = `url("${im.src}")`; }; im.src = 'assets/rooms/cabinet-room-v1.png'; }

 function statics() {
  document.title = ui('내각 회의실', 'Cabinet Chamber');
  $('ttl').textContent = ui('내각 회의실', 'CABINET CHAMBER'); $('scrT').textContent = ui('제국 내각 · 평의회 의제', 'IMPERIAL CABINET · COUNCIL AGENDA');
  $('tagDemo').textContent = ui('시험 · 가짜 장관', 'Test · fake ministers'); $('x').textContent = '✕'; $('x').title = ui('집무실로 돌아가기 (Esc)', 'Back to the office (Esc)');
  $('toCap').textContent = ui('발언 대상', 'Speaking to'); $('toAll').textContent = ui('전체에게', 'To everyone');
  $('q').placeholder = ui('장관들에게 발언…', 'Speak to the ministers…'); $('send').textContent = ui('발언', 'Speak');
  $('back').textContent = ui('‹ 집무실로 돌아가기', '‹ Back to the office');
 }
 /** 자리 계산(2026-10-19 배경 의자에 맞춤): 장관을 왼쪽·오른쪽에 번갈아(직책 순). 배경 그림(9종 모두 같은 구도)의 의자 자리를 그림 좌표(%)로 두고,
  *  창 크기에 맞춰 background-size:cover 와 같은 방식으로 화면 좌표(px)로 바꾼다. 한쪽에 4명까지는 의자에 그대로, 더 많으면 의자 줄을 따라 사이사이에 앉는다.
  *  CHAIRS: 왼쪽 줄, 스크린 쪽(멀리) → 내 앞(가까이). x = 의자 가운데, top·bot = 등받이 위·아래. 오른쪽은 좌우 대칭. */
 const CHAIRS = [{ x: 25, top: 37, bot: 45 }, { x: 20.5, top: 36.5, bot: 48 }, { x: 13.8, top: 36, bot: 52 }, { x: 4.8, top: 36, bot: 57 }];
 const BG = { w: 1672, h: 940 };
 function chairAt(f) { // f: 0(멀리)~1(가까이), 의자 줄을 따라 보간
  const k = Math.min(CHAIRS.length - 1.0001, Math.max(0, f * (CHAIRS.length - 1))), i = Math.floor(k), r = k - i, a = CHAIRS[i], b = CHAIRS[i + 1];
