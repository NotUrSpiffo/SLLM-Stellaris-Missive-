<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>검증효과 한 번에 보기</title><script src="i18n-catalog.js"></script><script src="i18n-ui.js"></script><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#0b1820;color:#dcecf0;font:14px/1.6 'Malgun Gothic',sans-serif}header{padding:16px 22px;border-bottom:1px solid #34515d}h1{font-size:21px;margin:0 0 7px}p{margin:5px 0;color:#a9c1c9}main{flex:1;min-height:0;overflow:auto;padding:12px 22px;scrollbar-width:thin;scrollbar-color:#436a78 transparent}footer{padding:12px 22px;border-top:1px solid #34515d;display:flex;align-items:center;flex-wrap:wrap;gap:10px}button,select{font:inherit;color:inherit;background:#153541;border:1px solid #507986;padding:7px 12px;border-radius:4px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}table{width:100%;border-collapse:collapse}th{text-align:left;color:#83d7df}td,th{padding:9px;border-bottom:1px solid #29434e;vertical-align:top}td:first-child{width:34px}code{font-size:11px;color:#88a8b1;display:block}.muted{color:#a9c1c9;font-size:12px}.good{color:#83dfb3}.bad{color:#f1a385}#error{color:#f1a385}#summary{margin-left:auto}label{cursor:pointer}input{accent-color:#63ccd6}#saved{margin-right:7px}.tags{font-size:11px;color:#e0c789}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px}
</style><link rel="stylesheet" href="scrollbar-dark.css"></head><body><header><h1>검증효과 한 번에 보기</h1><p>테스트용 세이브에서 일시정지한 뒤 실행하세요. 효과별로 부착 → 존재 확인 → 제거를 진행합니다. 기존 효과는 건드리지 않습니다.</p><p class="muted">시험 기간은 2일입니다. 생산량·지속 기간·게임 이벤트 연결은 별도 확인이 필요합니다. 첩보 항목은 시험 정의이며, 새 모드 파일을 읽으려면 게임 재시작이 필요합니다.</p><div id="session" class="muted"></div></header><main><div class="toolbar"><button id="all">전체 선택</button><button id="none">선택 해제</button><label>관계 검사 대상 <select id="target"><option value="0">선택 안 함 — 관계 검사 건너뛰기</option></select></label></div><table><thead><tr><th></th><th>검증 효과</th><th>대상</th><th>결과</th></tr></thead><tbody id="rows"></tbody></table><p id="error" role="alert"></p></main><footer><label><input type="checkbox" id="saved">테스트 세이브를 저장했고 일시정지했습니다</label><button id="run">선택 효과 일괄 검증</button><button id="stop" disabled>다음 검사 중단</button><button id="report" disabled>기록 폴더</button><span id="summary" role="status"></span></footer><script>
const $=id=>document.getElementById(id),selected=new Set();let latest=null,initialized=false;
const statuses={waiting:'대기',running:'검증 중',attached_removed:'부착·제거 확인',existing:'기존 효과 있음 · 건너뜀',no_target:'대상 없음',attach_failed:'부착 확인 실패',cleanup_failed:'제거 실패 · 중단',unknown:'확인 불가 · 중단',cancelled:'취소'};
function render(s){latest=s;if(!initialized){s.effects.forEach(e=>selected.add(e.id));initialized=true;}const target=$('target').value;const options=[new Option('선택 안 함 — 관계 검사 건너뛰기','0'),...s.targets.map(t=>new Option(t.name,String(t.idx)))];$('target').replaceChildren(...options);$('target').value=options.some(o=>o.value===target)?target:'0';$('target').disabled=s.busy;
 $('session').textContent=`세이브 ${s.sid||'미연결'} · ${s.date||'날짜 대기'} · 남은 ${s.effects.length}개 · 부착·제거 확인 ${s.verifiedCount||0}개는 목록에서 제외`;
 const results=new Map(s.rows.map(r=>[r.id,r]));$('rows').replaceChildren();s.effects.forEach(e=>{const tr=document.createElement('tr'),check=document.createElement('input');check.type='checkbox';check.checked=selected.has(e.id);check.disabled=s.busy;check.onchange=()=>{check.checked?selected.add(e.id):selected.delete(e.id);controls();};const cell=document.createElement('td');cell.append(check);const label=document.createElement('td');label.textContent=e.label;const key=document.createElement('code');key.textContent=e.modifier;label.append(key);const scope=document.createElement('td');scope.textContent={country:'플레이어 제국',faction:'현재 파벌 1개',opinion:'선택 제국 → 플레이어'}[e.scope];const result=document.createElement('td'),r=results.get(e.id);result.textContent=r?statuses[r.status]||r.status:'미검증';result.className=r?.status==='attached_removed'?'good':['attach_failed','cleanup_failed','unknown'].includes(r?.status)?'bad':'';if(r?.delta!==undefined){const detail=document.createElement('div');detail.className='muted';detail.textContent=`관계 변화 ${r.delta} / 예상 ${e.expected} · 수치 ${r.numericConfirmed?'일치':'미확인'} · 원복 ${r.restored?'확인':'미확인'}`;result.append(detail);}if(r?.error){const detail=document.createElement('div');detail.className='muted';detail.textContent=r.error;result.append(detail);}tr.append(cell,label,scope,result);$('rows').append(tr);});$('report').disabled=!s.reportPath;$('summary').textContent=s.busy?`${s.rows.filter(r=>!['waiting','running'].includes(r.status)).length}/${s.rows.length} 처리 중`:`${s.rows.filter(r=>r.status==='attached_removed').length}개 부착·제거 확인`;controls();}
function controls(){const busy=latest?.busy;$('run').disabled=busy||!$('saved').checked||!selected.size;$('stop').disabled=!busy;$('all').disabled=$('none').disabled=$('saved').disabled=busy;}
$('saved').onchange=controls;$('all').onclick=()=>{latest.effects.forEach(e=>selected.add(e.id));render(latest);};$('none').onclick=()=>{selected.clear();render(latest);};$('run').onclick=async()=>{$('error').textContent='';try{const r=await window.sllm.effectVerifyRun({saved:$('saved').checked,ids:[...selected],target:Number($('target').value)});if(!r.ok)$('error').textContent=r.error;}catch(e){$('error').textContent=String(e);}};$('stop').onclick=()=>window.sllm.effectVerifyStop();$('report').onclick=()=>window.sllm.effectVerifyReport();window.sllm.onEffectVerifyState(render);window.sllm.effectVerifyState().then(render);controls();
</script></body></html>
