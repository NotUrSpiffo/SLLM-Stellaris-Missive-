<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>총독</title>
<style>

 :root{--mono:"D2Coding","Cascadia Mono",Consolas,"Malgun Gothic",monospace;--bg:#06141b;--panel:#0b2230;--text:#dcecf0;--dim:#7fa3ad;--hi:#5fd4e4;--hi-text:#04161d;--ai:#7fe3f0;--gold:#e8c872;--bad:#e0705f;--good:#6fd6a8;--linec:#5fd4e4;--shade:#06141b;

 *{box-sizing:border-box}
 html,body{height:100%}
 body{position:relative}

 #mailbar{display:none;justify-content:space-between;align-items:center;color:var(--gold);font-size:12px;border-left:2px solid var(--gold);padding:1px 8px;cursor:pointer;flex:none}

 details[open] summary{border-bottom:1px solid var(--line2);margin-bottom:5px}
 details label{display:inline-block;margin:3px 12px 3px 0;font-size:12px}
 #custom{margin:2px 0 4px} #custom[hidden]{display:none}
 #titlebar button.ico{display:flex;align-items:center;justify-content:center} #titlebar button.ico.on{color:var(--hi);border-color:var(--line)}

 #drawer .dhead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line2)}
 #drawer .dhead b{font-weight:600;letter-spacing:.08em;color:var(--gold)}

 #gvList .it{display:flex;align-items:center;gap:8px;margin:4px 0;padding:6px 8px;border:1px solid var(--line2);cursor:pointer;background:var(--shade)} #gvList .it:hover{border-color:var(--hi)} #gvList .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} #gvList .gv{color:var(--dim);font-size:11px} #gvList .cp{color:var(--gold);font-size:11px}
 #gvHead{display:flex;gap:10px;align-items:flex-start;margin:6px 0} #gvPic{width:64px;height:80px;flex:none;border:1px solid var(--line);background:var(--shade);overflow:hidden} #gvPic img,#gvPic svg{width:100%;height:100%;object-fit:cover;display:block}
 #gvScene{position:relative;margin:6px 0 0;border:1px solid var(--line);border-bottom:0;overflow:hidden;background:#0a1018;aspect-ratio:400/152} #gvBg{position:absolute;inset:0;width:100%;height:100%;display:block} #gvScene #gvHead{position:absolute;left:10px;right:10px;bottom:8px;margin:0;text-shadow:0 1px 3px #000,0 0 8px #000} #gvScene #gvPlanet,#gvScene #gvFacts{color:#e2edf3} #gvScene #gvPic{box-shadow:0 2px 10px #000a}
 #gvLog{height:210px;overflow-y:auto;border:1px solid var(--line2);background:var(--shade);padding:6px 8px;margin:0 0 6px;border-top:0;font-family:var(--mono);font-size:12.5px} #gvLog .ln{margin:0 0 6px} #gvLog .who{font-size:10.5px;color:var(--dim)} #gvLog .me .who{color:var(--hi)} #gvLog .sys{color:var(--dim);font-size:11.5px}
 #gvSug{margin:0 0 6px;padding:6px 8px;border:1px solid var(--gold);background:var(--shade);font-size:12px} #gvSug button{margin:0 0 0 6px;padding:2px 8px;font-size:11px} #gvMemBar{margin:0 0 6px} #gvMemBar button{margin:0 6px 0 0;padding:2px 8px;font-size:11px} #gvMemList{margin:0 0 6px;border:1px solid var(--line2);background:var(--shade);padding:4px 8px;font-size:12px} #gvMemList .m{display:flex;gap:6px;align-items:flex-start;margin:3px 0} #gvMemList .m span{flex:1} #gvMemList .m button{padding:0 6px;font-size:11px;margin:0}
 #gvRow{display:flex;gap:6px;align-items:center} #gvRow input{flex:1}
 .pane{display:none;overflow-y:auto;padding:8px 12px 14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent} .pane.show{display:block}
 .pane .sec{margin:14px 0 4px;padding-bottom:3px;border-bottom:1px solid var(--line2)} .pane .sec:first-child{margin-top:2px}
 .pane label{display:block;margin:6px 0} #custom label{display:inline-block;margin:3px 10px 3px 0}
 .pane button{margin:2px 4px 2px 0}
 .hint{color:var(--dim);font-size:11px;margin:2px 0 4px}
 #cur{display:flex;gap:10px;align-items:flex-start;margin:6px 0;padding:8px;border:1px solid var(--line2);background:var(--shade)} #cur .th{width:62px;height:78px;flex:none;border:1px solid var(--line);overflow:hidden;background:var(--bg)} #cur .th img,#cur .th svg{width:100%;height:100%;object-fit:cover;display:block} #cur .bd{flex:1;min-width:0} #cur .who{color:var(--gold);font-weight:600;margin-bottom:2px} #cur .drop{outline:2px dashed var(--hi);outline-offset:2px} #pstat{display:block;color:var(--dim);font-size:11px;margin-bottom:4px}
 #pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:6px 0} .pc{border:1px solid var(--line2);padding:5px;background:var(--shade);text-align:center;font-size:11px} .pc .th{height:84px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:4px;border:1px solid transparent} .pc .th.drop{border-color:var(--hi)} .pc img{max-width:100%;max-height:100%;object-fit:contain} .pc .none{color:var(--dim)} .pc button{margin:2px 1px 0;padding:2px 6px;font-size:11px} .pc .mine{color:var(--gold)} #mylist .it{display:flex;align-items:center;gap:8px;margin:4px 0;padding:3px;border:1px solid var(--line2)} #mylist img{width:34px;height:42px;object-fit:cover;flex:none} #mylist .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} #mylist button{margin:0;padding:2px 8px;font-size:11px} #pstat{margin-left:4px}

#gateBar{color:var(--dim);padding:4px 10px;font-size:12px}#gateBar[hidden]{display:none}#gateBar button{margin:0 4px}
</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;900&display=swap"><style id="usercss"></style><script src="theme.js"></script><script src="portrait-variants.js"></script><script src="i18n-catalog.js"></script><script src="i18n-ui.js"></script><link rel="stylesheet" href="window-chrome.css"><link rel="stylesheet" href="terminal-layout.css"><link rel="stylesheet" href="special-rooms.css"></head><body data-room="gov" class="fx">
<style>
 body{display:flex;flex-direction:column;overflow:hidden} #gwrap{flex:1;overflow-y:auto;padding:10px 16px 16px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
 #dgov{display:block;max-width:900px;margin:0 auto;padding:0} #gvLog{height:34vh;min-height:180px}
 #titlebar button.close{width:26px}
</style>
<div id="titlebar"><b>행성 총독</b><span class="exp">실험</span><span class="sp"></span><button class="close" id="gx" title="닫기 (Esc)">✕</button></div>
<div id="gwrap">
 <div id="dgov" class="pane">
  <div class="hint">내 행성의 총독에게 행성의 현재 상태를 보고 받고 조언을 구합니다(실험). 대화 내용은 저장되지 않습니다. 총독이 없는 행성은 '일반 총독관'이 맡고, 초상화는 내 제국의 기본 종족 초상화를 씁니다. 행성 목록을 읽는 데 몇 초 걸립니다.</div>
  <button id="gvRefresh" class="primary">내 행성 목록 읽기</button><span id="gvStat" class="cap"></span>
  <div id="gvList"></div>
  <div id="gvChat" hidden>
   <div id="gvScene"><svg id="gvBg" preserveAspectRatio="xMidYMid slice" viewBox="0 90 400 152"></svg>
   <div class="governor-desk room-art" aria-hidden="true"></div><div id="gvHead"><div id="gvPic"></div><div><div id="gvName" style="color:var(--gold);font-weight:600"></div><div id="gvPlanet" class="cap"></div><div id="gvLv" class="cap" style="color:var(--gold)"></div><div id="gvFacts" class="hint"></div></div></div>
   </div>
   <div id="gvLog"></div>
   <div id="gvSug" hidden><span id="gvSugT"></span> <button id="gvSugY">기억하기</button><button id="gvSugN">넘기기</button></div>
   <div id="gvMemBar" hidden><button id="gvKeep" title="총독의 마지막 대사를 특별한 기억으로 남깁니다">방금 대사 기억하기</button><button id="gvMemBtn">기억 (0)</button></div>
   <div id="gvMemList" hidden></div>
   <div id="gvRow"><input id="gvQ" placeholder="총독에게 묻기… (예: 이 행성 상황이 어때?)" autocomplete="off"><button id="gvSend" class="primary">보내기</button></div>
   <div style="margin-top:6px"><button id="gvAgain" title="행성 상태를 게임에서 다시 읽어 옵니다">상태 다시 읽기</button><button id="gvBack">목록으로</button></div>
  </div>
 </div>
</div>
<script>
 const $ = (id) => document.getElementById(id);
 const hue = (s) => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
 function portraitSvg(name, url) {
   if (url) return '<img src="' + url + '">';
   const h = hue(name || '?');
   return '<svg viewBox="0 0 92 116"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(' + h + ' 30% 22%)"/><stop offset="1" style="stop-color:var(--shade)"/></linearGradient></defs>' +
     '<rect width="92" height="116" fill="url(#pg)"/><circle cx="46" cy="46" r="19" fill="hsl(' + h + ' 18% 62%)" opacity=".85"/><path d="M8 116c2-26 16-38 38-38s36 12 38 38z" fill="hsl(' + h + ' 18% 50%)" opacity=".85"/></svg>';
 }
 const CLASS_KEYS = ['', 'human', 'mammalian', 'reptilian', 'avian', 'arthropoid', 'molluscoid', 'fungoid', 'plantoid', 'infernal', 'lithoid', 'necroid', 'aquatic', 'toxoid', 'robot', 'machine', 'cybernetic'];
 let imgState = { bg: null, bgOpacity: 0.3, images: {}, scope: 'country' };
 const setImg = (st) => { imgState = st || imgState; if (gv.sel >= 0) gvShow(); };
 // ---- 총독과 대화(실험) ----
 // 행성 종류별 배경: 하늘 색 두 개, 지면 색, 장식(별·태양·산·물결 등)을 그림으로 만든다. 이름으로 씨앗을 정해 같은 행성은 늘 같은 모양.
 const PC_KO = ['', '사막 행성', '초원 행성', '대륙 행성', '열대 행성', '해양 행성', '북극·빙설 행성', '고산 행성', '불모의 행성', '핵폐허 행성', '용암 행성', '독성 행성', '가스 거인', '소행성', '기계·도시 행성', '고리 세계', '서식지', '장막에 싸인 행성', '군집 행성', '건조 행성', '가이아 행성', '툰드라 행성'];
 const gameBgs = {};
 function gvScene(name, pc) {
   const bgUrl = (imgState.planetBgs && imgState.planetBgs[pc]) || gameBgs[pc];
   if (bgUrl) return `<image href="${bgUrl}" x="0" y="90" width="400" height="152" preserveAspectRatio="xMidYMid slice"/><defs><linearGradient id="gvShade" x1="0" y1="0" x2="0" y2="1"><stop offset=".35" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".78"/></linearGradient></defs><rect y="90" width="400" height="152" fill="url(#gvShade)"/>`;
   let h = 7; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
   const rnd = () => { h = (h * 1664525 + 1013904223) >>> 0; return h / 4294967296; };
   if (pc === 19) pc = 1; else if (pc === 20) pc = 3; else if (pc === 21) pc = 6; // 사진이 없을 때 그림으로 대신하는 가까운 종류
   const W = 400, H = 320, hz = 200; let defs = '', back = '', front = '';
   const stars = (n, a) => { let o = ''; for (let i = 0; i < n; i++) o += `<circle cx="${(rnd() * W).toFixed(0)}" cy="${(rnd() * (hz - 20)).toFixed(0)}" r="${(rnd() * 1.2 + .3).toFixed(1)}" fill="#fff" opacity="${(rnd() * a + .2).toFixed(2)}"/>`; return o; };
   const ridge = (base, amp, col, n, op) => { let d = `M0 ${H} L0 ${base}`; for (let i = 1; i <= n; i++) d += ` L${(W / n * i).toFixed(0)} ${(base - rnd() * amp).toFixed(0)}`; return `<path d="${d} L${W} ${H} Z" fill="${col}" opacity="${op || 1}"/>`; };
   const sun = (x, y, r, c, glow) => `<circle cx="${x}" cy="${y}" r="${r * 2.6}" fill="${glow || c}" opacity=".18"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
   const cl = (n, c, op) => { let o = ''; for (let i = 0; i < n; i++) { const x = rnd() * W, y = 30 + rnd() * 110, w = 40 + rnd() * 70; o += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${w.toFixed(0)}" ry="${(w / 6).toFixed(0)}" fill="${c}" opacity="${op}"/>`; } return o; };
   let sky = ['#10243a', '#35577a'], ground = '#1c2a22';
   switch (pc) {
     case 1: sky = ['#3a2a52', '#e8a35a']; ground = '#8a5a30'; back = sun(290, 130, 26, '#ffd9a0', '#ffb060') + ridge(hz, 18, '#a8693a', 9, .85); front = ridge(hz + 30, 12, '#7c4a26', 7) + ridge(hz + 70, 8, '#5e3a1e', 5); break;

 const gvGovName = (p) => (p.governor && p.governor.trim()) || '일반 총독관';
