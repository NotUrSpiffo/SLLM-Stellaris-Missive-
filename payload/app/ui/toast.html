<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>SLLM 알림</title>
<style>
 :root{--bg:#06141b;--panel:#0b2230;--text:#dcecf0;--dim:#7fa3ad;--hi:#5fd4e4;--gold:#e8c872;--linec:#5fd4e4;--glow:rgba(40,140,160,.12);--cardbg:linear-gradient(160deg,#0f2f40,#0a1f2b);
  --line:color-mix(in srgb,var(--linec) 34%,transparent);--mono:"D2Coding","Cascadia Mono",Consolas,"Malgun Gothic",monospace}
 *{box-sizing:border-box}
 html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;font:13px/1.45 "Malgun Gothic","Segoe UI",sans-serif;color:var(--text)}
 #card{position:relative;min-height:100%;margin:0;padding:9px 30px 8px 12px;background:var(--cardbg);border:1px solid var(--line);box-shadow:0 0 14px rgba(0,0,0,.55),inset 0 0 14px var(--glow);cursor:pointer;animation:in .22s ease-out}
 @keyframes in{from{opacity:0;transform:translateX(var(--from,10px))}to{opacity:1;transform:none}}
 #card::before,#card::after{content:"";position:absolute;width:8px;height:8px;border:1px solid var(--hi);pointer-events:none}
 #card::before{left:-1px;top:-1px;border-right:0;border-bottom:0} #card::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
 #kind{font:10.5px var(--mono);letter-spacing:.12em;color:var(--dim)}
 #title{color:var(--gold);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #body{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 #act{display:none;margin-top:7px;width:100%;padding:6px 8px;border:1px solid var(--hi);background:color-mix(in srgb,var(--hi) 14%,transparent);color:var(--hi);cursor:pointer;font:inherit;letter-spacing:.04em} #act:hover{background:var(--hi);color:#04161d}
 #x{position:absolute;right:4px;top:3px;width:22px;height:20px;border:0;background:none;color:var(--dim);cursor:pointer;padding:0}
 #x:hover{color:var(--text)}
</style><script src="theme.js"></script><script src="i18n-catalog.js"></script><script src="i18n-ui.js"></script></head><body>
<div id="card"><div id="kind">알림</div><div id="title"></div><div id="body"></div><button id="act"></button><button id="x" title="닫기">✕</button></div>
<script>
 const $ = (id) => document.getElementById(id);
 let kind = 'info';
 window.sllm.onToast((m) => { kind = m.kind; $('kind').textContent = m.kind === 'letter' ? '수신 // 편지' : m.kind === 'event' ? '알림 // 사건' : m.kind === 'speech' ? '알림 // 연설' : m.kind === 'press' ? '취재 // 언론사 인터뷰' : m.kind === 'vassal' ? '통신 // 종속국' : m.kind === 'fleet' ? '보고 // 함대 사령부' : m.kind === 'office' ? '서신 // 집무실' : m.kind === 'declare' ? '긴급 // 전쟁 선언문' : m.kind === 'statement' ? '외교 // 성명' : m.kind === 'debate' ? '라디오 // 찬반 논평' : m.kind === 'scandal' ? '추문 // 언론 보도' : m.kind === 'hearing' ? '첩보 // 해명 요구' : m.kind === 'news' ? '알림 // 신문' : m.kind === 'gov' ? '통신 // 총독' : m.kind === 'faction' ? '소집 // 내각 회의' : m.kind === 'mediation' ? '제안 // 평화 중재' : '알림'; $('title').textContent = m.title; $('body').textContent = m.body; $('act').style.display = m.action ? 'block' : 'none'; $('act').textContent = m.action || ''; const c = $('card'); c.style.animation = 'none'; void c.offsetWidth; c.style.animation = ''; });
 window.sllm.onTheme((t) => applyTheme(t.theme, t.custom));
 window.sllm.launcherState().then((s) => applyTheme(s.theme, s.custom));
 $('card').onclick = () => window.sllm.toastClick(kind);
 $('act').onclick = (e) => { e.stopPropagation(); window.sllm.toastAction(); };
 $('x').onclick = (e) => { e.stopPropagation(); window.sllm.toastClose(); };
</script></body></html>
