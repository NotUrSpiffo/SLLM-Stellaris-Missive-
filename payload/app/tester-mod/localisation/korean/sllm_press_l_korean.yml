l_korean:
 edict_sllm_press:0 "언론사 인터뷰"
 edict_sllm_press_desc:0 "시행령을 켜면 언론사 인터뷰 준비를 시작합니다. 준비에는 3개월이 걸리며 동반 앱에서 기자의 질문에 답합니다. 주제마다 좋은 평가를 받으면 국민 행복도가 3%씩 올라 1년 동안 유지됩니다(최대 +9%). 활성화 비용과 유지비는 없습니다. 다음 준비는 6개월 뒤에 가능하며, 다시 준비하려면 시행령을 껐다 켜세요."
 sllm_press_cd_tt:0 "최근 6개월 안에 언론사 인터뷰를 준비했습니다."
 sllm_press_edict_start_tt:0 "인터뷰 준비를 시작합니다. 3개월 뒤 동반 앱이 알려 줍니다. 다음 준비는 6개월 뒤에 가능합니다."
 sllm_press_edict_off_tt:0 "시행령을 끕니다. 이미 시작한 인터뷰 준비와 적용된 인터뷰 효과는 취소되지 않습니다."
 sllm_press_happy_1:0 "언론 인터뷰: 호평 1건"
 sllm_press_happy_1_desc:0 "언론사 인터뷰에서 한 주제에 좋은 평가를 받아 국민 행복도가 오릅니다."
 sllm_press_happy_2:0 "언론 인터뷰: 호평 2건"
 sllm_press_happy_2_desc:0 "언론사 인터뷰에서 두 주제에 좋은 평가를 받아 국민 행복도가 오릅니다."
 sllm_press_happy_3:0 "언론 인터뷰: 호평 3건"
 sllm_press_happy_3_desc:0 "언론사 인터뷰의 모든 주제에서 좋은 평가를 받아 국민 행복도가 오릅니다."
