 sllm_trait_admiral_reprimanded:0 "질책받은 제독"
 sllm_trait_admiral_reprimanded_desc:0 "청문회에서 질책을 받았습니다. 1년 동안 감봉되어 유지비가 줄지만, 이 지휘관의 함대와 지상군은 약해집니다."
