l_korean:
 edict_sllm_speech:0 "연설하기"
 edict_sllm_speech_desc:0 "시행령을 켜면 연설 준비를 시작합니다. 준비에는 3개월이 걸리며 동반 앱에서 연설을 진행합니다. 활성화 비용과 유지비는 없습니다. 다음 준비는 6개월 뒤에 가능하며, 다시 준비하려면 시행령을 껐다 켜세요."
 sllm_speech_edict_start_tt:0 "연설 준비를 시작합니다. 3개월 뒤 동반 앱이 알려 줍니다. 다음 준비는 6개월 뒤에 가능합니다."
 sllm_speech_edict_off_tt:0 "시행령을 끕니다. 이미 시작한 연설 준비와 적용된 연설 효과는 취소되지 않습니다."