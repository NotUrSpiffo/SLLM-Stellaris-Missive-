 decision_sllm_speech_desc:0 "연설을 준비합니다. 3개월 뒤 준비가 끝나면 동반 앱이 알려 줍니다. 연설의 종류와 내용에 따라 일정 기간 제국에 버프가 걸립니다. 6개월에 한 번만 준비할 수 있습니다."
 sllm_speech_cd_tt:0 "최근 6개월 안에 연설을 준비했습니다."
