 sllm_ally_reaffirm_desc:0 "Reafirmamos el entendimiento en el consejo. El tratado de la pantalla de diplomacia no cambia."
 sllm_ally_compact:0 "Arreglo del consejo aliado"
 sllm_ally_compact_desc:0 "Abrimos las fronteras y creció la confianza. Esto no es un pacto defensivo."
 sllm_ally_coordination:0 "Ofensiva del consejo aliado"
 sllm_ally_coordination_desc:0 "El consejo acordó seguir la guerra. El daño de las armas sube durante un año."
